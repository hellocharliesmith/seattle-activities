<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Pools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10222b;
    --ink-soft: #3c545c;
    --paper: #f1f6f5;
    --surface: #ffffff;
    --teal: #0d7d87;
    --teal-deep: #095a62;
    --teal-wash: #e2f1f1;
    --sun: #c97f13;
    --sun-wash: #faedd6;
    --open: #1f8a5b;
    --open-wash: #e3f3e9;
    --muted: #7c8b90;
    --line: #dbe6e4;
    --danger: #b14a34;
    --danger-wash: #f7e7e2;
    --shadow: 0 1px 2px rgba(16, 34, 43, 0.06), 0 4px 16px rgba(16, 34, 43, 0.06);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 64px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  header.top .inner { max-width: 560px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  header.top h1 {
    font-size: 20px; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
  }
  .checked-chip {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .low-confidence {
    margin: 16px 0; padding: 12px 14px; border-radius: 10px;
    background: var(--danger-wash); color: var(--danger);
    font-size: 13px; border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  }

  section { margin-top: 28px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  h2.today-date { font-size: 24px; margin: 0 0 4px; text-wrap: balance; }
  .section-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }

  .card-list { display: flex; flex-direction: column; gap: 10px; }

  .thumb {
    width: 42px; height: 42px; border-radius: 9px; flex: 0 0 auto;
    object-fit: cover; background: var(--line); display: block;
  }
  .thumb.thumb-empty { background: var(--teal-wash); }

  details.pool-card {
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  details.pool-card.is-closed { opacity: 0.8; }
  details.pool-card > summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  details.pool-card > summary::-webkit-details-marker { display: none; }
  .summary-body { flex: 1; min-width: 0; }
  .row-name {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0;
  }
  .row-name .name {
    font-weight: 700; font-size: 14.5px; flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-text {
    font-size: 11.5px; font-weight: 700; white-space: nowrap; flex: 0 0 auto;
    color: var(--muted);
  }
  details.pool-card.is-open .status-text { color: var(--open); }
  details.pool-card.is-holiday .status-text { color: var(--sun); }
  details.pool-card.is-upcoming .status-text { color: var(--teal); }
  details.pool-card.is-closed .status-text { color: var(--danger); }
  .row-meta { margin-top: 2px; }
  .row-meta .addr-line {
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }
  details.pool-card > summary .chev { color: var(--muted); transition: transform 0.15s; flex: 0 0 auto; }
  details.pool-card > summary .chev::after { content: "\25B8"; }
  details.pool-card[open] > summary .chev { transform: rotate(90deg); }

  .pool-expand { padding: 0 14px 14px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 12px; }
  .pool-expand .blurb { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }
  .pool-expand .season-line { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }

  .holiday-note {
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
    background: var(--sun-wash); border: 1px solid color-mix(in srgb, var(--sun) 35%, transparent);
    font-size: 13px; color: var(--ink);
  }
  .holiday-note .h-label { display: block; font-weight: 700; color: var(--sun); margin-bottom: 3px; font-size: 12px; }
  .holiday-note ul { margin: 6px 0 0; padding-left: 18px; }
  .holiday-note li { margin-bottom: 2px; }

  .closure-note {
    border-radius: 10px; padding: 10px 12px; margin-bottom: 4px;
    background: var(--danger-wash); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    font-size: 13px; color: var(--ink);
  }
  .closure-note .h-label { display: block; font-weight: 700; color: var(--danger); margin-bottom: 3px; font-size: 12px; }

  .sched-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 6px; }
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
  table.sched {
    border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 420px;
  }
  table.sched th, table.sched td {
    text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top;
  }
  table.sched thead th {
    background: var(--teal-wash); color: var(--teal-deep); font-weight: 700;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
  }
  table.sched tbody tr:last-child td { border-bottom: none; }
  table.sched tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--paper) 55%, var(--surface)); }
  table.sched td:first-child, table.sched th:first-child { font-weight: 600; white-space: nowrap; }

  .pdf-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
  .pdf-chip {
    font-size: 12.5px; font-weight: 600; color: var(--teal); text-decoration: none;
    background: var(--teal-wash); padding: 6px 11px; border-radius: 999px;
  }
  .pdf-chip:hover { text-decoration: underline; }

  .today-actions { display: flex; gap: 8px; margin-top: 12px; }
  .today-actions .action-btn {
    flex: 1; text-align: center; padding: 10px 10px; border-radius: 9px;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--teal); font-weight: 700; font-size: 13px; text-decoration: none;
  }
  .today-actions .action-btn:hover { background: var(--teal-wash); }

  footer {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px;
  }
  footer a { color: var(--teal); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .disclaimer { margin-top: 6px; }

  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    details.pool-card > summary .chev { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="inner">
      <h1 class="display"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="vertical-align:-3px;margin-right:2px;"><path d="M3 17c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="6" r="3" fill="var(--sun)"/></svg>Seattle Pools</h1>
      <span class="checked-chip" id="checked-chip"></span>
    </div>
  </header>

  <div id="low-confidence-slot"></div>

  <section id="today-header">
    <p class="eyebrow">Today</p>
    <h2 class="today-date display" id="today-date"></h2>
  </section>

  <section id="outdoor-section">
    <p class="eyebrow">Outdoor pools &middot; summer only</p>
    <h2 class="display" style="font-size:20px;margin:0 0 4px;">Colman &amp; Mounger</h2>
    <p class="section-sub">Closed for the winter outside their summer season.</p>
    <div id="outdoor-list" class="card-list"></div>
  </section>

  <section id="indoor-section">
    <p class="eyebrow">Indoor pools &middot; year-round</p>
    <h2 class="display" style="font-size:20px;margin:0 0 4px;">8 neighborhood pools</h2>
    <p class="section-sub">Open all year; the schedule below is the currently-posted session.</p>
    <div id="indoor-list" class="card-list"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script id="pool-data" type="application/json">__POOL_DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('pool-data').textContent);

  document.getElementById('checked-chip').textContent = 'Checked ' + DATA.generated_at;
  document.getElementById('today-date').textContent = DATA.date_label;

  if (DATA.low_confidence) {
    const box = document.createElement('div');
    box.className = 'low-confidence';
    box.textContent = 'Heads up: the last check could not fully parse one or more pool schedules. Details below may be incomplete - verify anything important against the official page.';
    document.getElementById('low-confidence-slot').appendChild(box);
  }

  const STATUS_CLASS = {
    open: 'is-open', holiday: 'is-holiday', upcoming: 'is-upcoming',
    ended: '', unknown: '', facility_closed: 'is-closed',
  };
  // Wording differs by kind: an outdoor pool's season genuinely ends (the
  // facility shuts for winter); an indoor pool stays open year-round, so
  // "ended" just means the posted schedule table looks stale, not that the
  // building closed.
  const STATUS_LABEL = {
    outdoor: {
      open: 'In season today', holiday: 'Holiday hours', upcoming: 'Starts',
      ended: 'Season ended', unknown: 'See official page',
    },
    indoor: {
      open: 'Current schedule', holiday: 'Holiday hours', upcoming: 'New schedule',
      ended: 'Schedule may be outdated', unknown: 'See official page',
    },
  };

  function thumbHtml(pool) {
    return pool.image_url
      ? '<img class="thumb" src="' + pool.image_url + '" alt="" loading="lazy">'
      : '<span class="thumb thumb-empty"></span>';
  }

  renderGroup(DATA.outdoor_pools, document.getElementById('outdoor-list'), 'outdoor', true);
  renderGroup(DATA.indoor_pools, document.getElementById('indoor-list'), 'indoor', false);

  function renderGroup(pools, container, kind, openFirst) {
    pools.forEach((pool, i) => {
      const det = document.createElement('details');
      det.className = 'pool-card ' + (STATUS_CLASS[pool.status] || '');
      if (openFirst && i === 0) det.open = true;

      const summary = document.createElement('summary');
      const labels = STATUS_LABEL[kind];
      let statusText = pool.status === 'facility_closed' ? 'Closed' : (labels[pool.status] || '');
      if (pool.status === 'upcoming' && pool.season_start) statusText = labels.upcoming + ' ' + pool.season_start;
      if (pool.status === 'ended' && pool.season_end) statusText = labels.ended + (kind === 'outdoor' ? ' ' + pool.season_end : '');
      summary.innerHTML =
        thumbHtml(pool) +
        '<span class="summary-body">' +
          '<span class="row-name">' +
            '<span class="name">' + escapeHtml(pool.name) + '</span>' +
            '<span class="status-text">' + escapeHtml(statusText) + '</span>' +
          '</span>' +
          '<span class="row-meta"><span class="addr-line">' + escapeHtml(pool.address || '') + '</span></span>' +
        '</span>' +
        '<span class="chev"></span>';
      det.appendChild(summary);

      const expand = document.createElement('div');
      expand.className = 'pool-expand';
      let html = '';
      if (pool.blurb) html += '<p class="blurb">' + escapeHtml(pool.blurb) + '</p>';

      if (pool.status === 'facility_closed' && pool.closure) {
        html += '<div class="closure-note"><span class="h-label">' + escapeHtml(pool.closure.heading) + '</span>' +
          (pool.closure.note ? escapeHtml(pool.closure.note) : '') + '</div>';
      } else {
        if (pool.season_label) {
          html += '<p class="season-line">' + escapeHtml(pool.season_label) + (pool.season_note ? ' - ' + escapeHtml(pool.season_note) : '') + '</p>';
        }
        if (pool.status === 'holiday' && pool.todays_holiday) {
          html += '<div class="holiday-note"><span class="h-label">Today is a holiday-schedule day</span>' + escapeHtml(pool.todays_holiday) + '</div>';
        } else if (pool.holiday_note || (pool.holiday_list && pool.holiday_list.length)) {
          html += '<div class="holiday-note"><span class="h-label">Holiday exceptions</span>' +
            (pool.holiday_note ? escapeHtml(pool.holiday_note) : '') +
            (pool.holiday_list && pool.holiday_list.length ? '<ul>' + pool.holiday_list.map(h => '<li>' + escapeHtml(h) + '</li>').join('') + '</ul>' : '') +
            '</div>';
        }
        if (pool.schedule) {
          html += '<p class="sched-label">Regular drop-in schedule</p>' + renderTable(pool.schedule);
        } else if (pool.schedule_pdfs && pool.schedule_pdfs.length) {
          html += '<p class="sched-label">Schedule</p><p class="section-sub" style="margin:0 0 4px;">Posted as a PDF rather than a page table for this pool:</p>' +
            '<div class="pdf-row">' + pool.schedule_pdfs.map(pdf =>
              '<a class="pdf-chip" href="' + pdf.url + '" target="_blank" rel="noopener">' + escapeHtml(pdf.label || 'Schedule PDF') + '</a>'
            ).join('') + '</div>';
        }
        if (pool.holiday_schedule) {
          html += '<p class="sched-label">Holiday schedule</p>' + renderTable(pool.holiday_schedule);
        }
      }
      html += '<div class="today-actions">' +
        '<a class="action-btn" href="' + pool.url + '" target="_blank" rel="noopener">Seattle.gov</a>' +
        (pool.map_url ? '<a class="action-btn" href="' + pool.map_url + '" target="_blank" rel="noopener">Map</a>' : '') +
      '</div>';
      expand.innerHTML = html;
      det.appendChild(expand);

      container.appendChild(det);
    });
  }

  function renderTable(t) {
    const cols = t.columns && t.columns.length ? t.columns.length : t.rows[0].length;
    let out = '<div class="table-wrap"><table class="sched">';
    if (t.columns) {
      out += '<thead><tr>' + t.columns.map(c => '<th>' + escapeHtml(c) + '</th>').join('') + '</tr></thead>';
    }
    out += '<tbody>' + t.rows.map(r => {
      const cells = r.slice(0, cols);
      while (cells.length < cols) cells.push('');
      return '<tr>' + cells.map(c => '<td>' + escapeHtml(c) + '</td>').join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
    return out;
  }

  const footer = document.getElementById('footer');
  footer.innerHTML =
    '<div><a href="' + DATA.hub_url + '" target="_blank" rel="noopener">Official seattle.gov pools page</a></div>' +
    '<div class="disclaimer">Unofficial mirror, rechecked automatically each morning (last: ' + DATA.generated_at + '). Schedules change by season and for weather/holidays - confirm anything important on the official pool page before heading out.</div>';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
})();
</script>
</body>
</html>
