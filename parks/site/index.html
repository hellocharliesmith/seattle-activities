<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Parks &amp; Playgrounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10222b;
    --ink-soft: #3c545c;
    --paper: #f1f6f5;
    --surface: #ffffff;
    --teal: #0d7d87;
    --teal-deep: #095a62;
    --teal-wash: #e2f1f1;
    --sun: #c97f13;
    --sun-wash: #faedd6;
    --open: #1f8a5b;
    --open-wash: #e3f3e9;
    --muted: #7c8b90;
    --line: #dbe6e4;
    --danger: #b14a34;
    --danger-wash: #f7e7e2;
    --shadow: 0 1px 2px rgba(16, 34, 43, 0.06), 0 4px 16px rgba(16, 34, 43, 0.06);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 64px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  header.top .inner { max-width: 560px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .back-home {
    display: flex; align-items: center; gap: 3px; width: fit-content; margin: 0 auto 6px;
    max-width: 560px; font-size: 12.5px; font-weight: 700; color: var(--teal); text-decoration: none;
  }
  .back-home:hover { text-decoration: underline; }
  header.top h1 {
    font-size: 20px; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
  }
  .checked-chip {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .low-confidence {
    margin: 16px 0; padding: 12px 14px; border-radius: 10px;
    background: var(--danger-wash); color: var(--danger);
    font-size: 13px; border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  }

  section { margin-top: 24px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  .section-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }

  .search-card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; }
  .filter-row { display: flex; gap: 8px; position: relative; }

  /* Multi-select dropdown filter (button + checkbox panel) */
  .msel { flex: 1 1 0; min-width: 0; }
  .msel-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .msel-btn:hover { background: var(--teal-wash); }
  .msel-btn .chev { color: var(--muted); font-size: 10px; }
  .msel-panel {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 6px; max-height: 260px; overflow-y: auto; display: none;
  }
  .msel-panel.open { display: block; }
  .msel-option { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .msel-option:hover { background: var(--teal-wash); }
  .msel-option input { accent-color: var(--teal); }
  .msel-help { font-size: 12px; color: var(--muted); margin-top: 8px; display: none; }
  .msel-help.visible { display: block; }
  .msel-help .msel-clear { color: var(--teal); font-weight: 700; cursor: pointer; margin-left: 4px; }
  .msel-help .msel-clear:hover { text-decoration: underline; }

  .result-count { font-size: 12.5px; color: var(--muted); margin: 12px 2px 10px; }

  .card-list { display: flex; flex-direction: column; gap: 10px; }

  .thumb {
    width: 42px; height: 42px; border-radius: 9px; flex: 0 0 auto;
    object-fit: cover; background: var(--line); display: block;
  }
  .thumb.thumb-empty { background: var(--teal-wash); }

  details.park-card {
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  details.park-card > summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  details.park-card > summary::-webkit-details-marker { display: none; }
  .summary-body { flex: 1; min-width: 0; }
  .row-name {
    display: flex; align-items: baseline; gap: 10px; min-width: 0;
  }
  .row-name .name {
    font-weight: 700; font-size: 14.5px; flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hood-line {
    display: block; font-size: 11.5px; font-weight: 700; margin-top: 2px;
    color: var(--teal-deep);
  }
  .row-meta { margin-top: 2px; }
  .row-meta .addr-line {
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }
  details.park-card > summary .chev { color: var(--muted); transition: transform 0.15s; flex: 0 0 auto; }
  details.park-card > summary .chev::after { content: "\25B8"; }
  details.park-card[open] > summary .chev { transform: rotate(90deg); }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .amenity-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--teal-wash); color: var(--teal-deep);
  }
  .splash-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--sun-wash); color: var(--sun);
  }

  .park-expand { padding: 0 14px 14px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 12px; }
  .park-expand .no-amenities { font-size: 13px; color: var(--muted); margin: 0 0 4px; }

  .today-actions { display: flex; gap: 8px; margin-top: 12px; }
  .today-actions .action-btn {
    flex: 1; text-align: center; padding: 10px 10px; border-radius: 9px;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--teal); font-weight: 700; font-size: 13px; text-decoration: none;
  }
  .today-actions .action-btn:hover { background: var(--teal-wash); }

  .no-results { text-align: center; padding: 32px 12px; color: var(--muted); font-size: 13.5px; }

  footer {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px;
  }
  footer a { color: var(--teal); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .disclaimer { margin-top: 6px; }

  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    details.park-card > summary .chev { transition: none; }
  }
</style>
</head>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('park-data').textContent);

  document.getElementById('checked-chip').textContent = 'Checked ' + DATA.generated_at;

  if (DATA.low_confidence) {
    const box = document.createElement('div');
    box.className = 'low-confidence';
    box.textContent = 'Heads up: the last refresh could not fully pull one or more amenity layers. Some parks below may be missing amenity badges they actually have - this list undercounts rather than overclaims.';
    document.getElementById('low-confidence-slot').appendChild(box);
  }

  const AMENITY_DEFS = [
    { key: 'has_playground', label: 'Playground' },
    { key: 'has_picnic', label: 'Picnic tables' },
    { key: 'has_restroom', label: 'Restroom' },
    { key: 'has_sport_court', label: 'Sport court' },
    { key: 'has_splashpad', label: 'Splashpad / wading pool' },
    { key: 'has_offleash', label: 'Off-leash area' },
  ];

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ---- Generic multi-select dropdown factory (button + checkbox panel) ----
  function makeMultiSelect(containerEl, { label, options, onChange }) {
    const state = new Set();
    containerEl.innerHTML =
      '<div class="msel"><button type="button" class="msel-btn"><span class="msel-label"></span><span class="chev">▾</span></button>' +
      '<div class="msel-panel"></div></div>';
    const btn = containerEl.querySelector('.msel-btn');
    const labelEl = containerEl.querySelector('.msel-label');
    const panel = containerEl.querySelector('.msel-panel');
    panel.innerHTML = options.map(o => '<label class="msel-option"><input type="checkbox" value="' + escapeHtml(o.value) + '"> ' + escapeHtml(o.label) + '</label>').join('');
    function updateLabel() { labelEl.textContent = state.size ? label + ' (' + state.size + ')' : label; }
    updateLabel();
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.msel-panel.open').forEach(p => { if (p !== panel) p.classList.remove('open'); });
      panel.classList.toggle('open');
    });
    panel.addEventListener('change', (e) => {
      if (e.target.value) {
        if (e.target.checked) state.add(e.target.value); else state.delete(e.target.value);
        updateLabel();
        onChange(state);
      }
    });
    document.addEventListener('click', (e) => { if (!containerEl.contains(e.target)) panel.classList.remove('open'); });
    return {
      getSelected: () => state,
      getSelectedLabels: () => options.filter(o => state.has(o.value)).map(o => o.label),
      clear: () => { state.clear(); panel.querySelectorAll('input').forEach(i => i.checked = false); updateLabel(); onChange(state); },
    };
  }

  const neighborhoodOptions = DATA.neighborhoods.map(n => ({ value: n.slug, label: n.label }));
  const amenityOptions = AMENITY_DEFS.map(a => ({ value: a.key, label: a.label }));

  let neighborhoodSel, amenitySel;
  function updateHelp() {
    const help = document.getElementById('filter-help');
    const nLabels = neighborhoodSel.getSelectedLabels();
    const aLabels = amenitySel.getSelectedLabels();
    const parts = [];
    if (nLabels.length) parts.push(nLabels.join(', '));
    if (aLabels.length) parts.push(aLabels.join(', '));
    if (!parts.length) {
      help.classList.remove('visible');
      help.innerHTML = '';
      return;
    }
    help.classList.add('visible');
    help.innerHTML = 'Showing: ' + escapeHtml(parts.join(' · ')) + '<span class="msel-clear" id="filter-clear">Clear</span>';
    document.getElementById('filter-clear').addEventListener('click', () => {
      neighborhoodSel.clear();
      amenitySel.clear();
    });
  }

  neighborhoodSel = makeMultiSelect(document.getElementById('filter-neighborhood'), {
    label: 'Neighborhood', options: neighborhoodOptions, onChange: () => { updateHelp(); renderList(); },
  });
  amenitySel = makeMultiSelect(document.getElementById('filter-amenity'), {
    label: 'Has...', options: amenityOptions, onChange: () => { updateHelp(); renderList(); },
  });

  function thumbHtml(park) {
    return park.image_url
      ? '<img class="thumb" src="' + park.image_url + '" alt="" loading="lazy">'
      : '<span class="thumb thumb-empty"></span>';
  }

  function amenityBadges(park) {
    let html = '';
    if (park.has_playground) html += '<span class="amenity-badge">Playground</span>';
    if (park.has_picnic) html += '<span class="amenity-badge">Picnic tables</span>';
    if (park.has_restroom) html += '<span class="amenity-badge">Restroom</span>';
    if (park.has_sport_court) html += '<span class="amenity-badge">Sport court</span>';
    if (park.has_offleash) html += '<span class="amenity-badge">Off-leash area</span>';
    if (park.has_splashpad) html += '<span class="splash-badge">Splashpad</span>';
    return html;
  }

  function renderList() {
    const neighborhoods = neighborhoodSel.getSelected();
    const amenities = amenitySel.getSelected();

    const filtered = DATA.parks.filter(p => {
      if (neighborhoods.size && !neighborhoods.has(p.neighborhood_bucket)) return false;
      for (const key of amenities) { if (!p[key]) return false; }
      return true;
    });

    const list = document.getElementById('parks-list');
    list.innerHTML = '';
    document.getElementById('result-count').textContent =
      filtered.length + (filtered.length === 1 ? ' park' : ' parks') + (DATA.parks.length !== filtered.length ? ' of ' + DATA.parks.length : '');

    if (!filtered.length) {
      list.innerHTML = '<p class="no-results">No parks match those filters. Try clearing one.</p>';
      return;
    }

    filtered.forEach((park) => {
      const det = document.createElement('details');
      det.className = 'park-card';
      det.dataset.slug = park.slug;

      const summary = document.createElement('summary');
      summary.innerHTML =
        thumbHtml(park) +
        '<span class="summary-body">' +
          '<span class="row-name">' +
            '<span class="name">' + escapeHtml(park.name) + '</span>' +
          '</span>' +
          '<span class="hood-line">' + escapeHtml(park.neighborhood_label) + '</span>' +
          '<span class="row-meta"><span class="addr-line">' + escapeHtml(park.address || 'Address not on file') + '</span></span>' +
          '<span class="tag-row">' + amenityBadges(park) + '</span>' +
        '</span>' +
        '<span class="chev"></span>';
      det.appendChild(summary);

      const expand = document.createElement('div');
      expand.className = 'park-expand';
      let html = '';
      if (!park.has_playground && !park.has_picnic && !park.has_restroom && !park.has_sport_court && !park.has_splashpad && !park.has_offleash) {
        html += '<p class="no-amenities">No amenities confirmed in this refresh - that likely means the data just doesn’t cover this park yet, not that it has nothing. Check the map link.</p>';
      }
      if (park.has_splashpad) {
        html += '<p class="no-amenities">This park has a spraypark or wading pool - see the full schedule on the <a href="../wading-pools/">wading pools &amp; sprayparks page</a>.</p>';
      }
      html += '<div class="today-actions">' +
        (park.seattle_url ? '<a class="action-btn" href="' + park.seattle_url + '" target="_blank" rel="noopener">Seattle.gov</a>' : '') +
        (park.map_url ? '<a class="action-btn" href="' + park.map_url + '" target="_blank" rel="noopener">Map</a>' : '') +
      '</div>';
      expand.innerHTML = html;
      det.appendChild(expand);

      list.appendChild(det);
    });
  }

  renderList();

  const footer = document.getElementById('footer');
  footer.innerHTML =
    '<div><a href="' + DATA.source_url + '" target="_blank" rel="noopener">Seattle GeoData - Parks &amp; Recreation open data</a></div>' +
    '<div class="disclaimer">Unofficial mirror built from Seattle Parks’ open GIS data, rechecked automatically each morning (last: ' + DATA.generated_at + '). Amenity badges reflect what the city’s data has mapped, which may lag behind reality at any given park - confirm anything important before heading out.</div>';
})();
</script>
</body>
</html>
