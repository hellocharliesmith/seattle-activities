<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle for Families</title>
<style>
  :root {
    --ink: #10222b; --ink-soft: #3c545c; --paper: #f1f6f5; --surface: #ffffff;
    --teal: #0d7d87; --teal-wash: #e2f1f1; --line: #dbe6e4;
    --shadow: 0 1px 2px rgba(16, 34, 43, 0.06), 0 4px 16px rgba(16, 34, 43, 0.06);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.sub { color: var(--ink-soft); margin: 0 0 24px; font-size: 14px; }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border-radius: 14px; padding: 16px;
    box-shadow: var(--shadow); text-decoration: none; color: inherit; margin-bottom: 12px;
  }
  .card .icon {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 12px;
    background: var(--teal-wash); display: flex; align-items: center; justify-content: center;
  }
  .card .icon svg { width: 26px; height: 26px; }
  .card .body { min-width: 0; }
  .card .name { font-weight: 700; font-size: 16px; }
  .card .desc { font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Seattle for Families</h1>
  <p class="sub">A collection of information for Seattle families.</p>

  <a class="card" href="wading-pools/">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="6.5" r="2.6" stroke="#0d7d87" stroke-width="1.5"/>
        <path d="M6.5 15C7 11 9 9.5 9.7 11.2 10.3 9.6 13.7 9.6 14.3 11.2 15 9.5 17 11 17.5 15" stroke="#0d7d87" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 15.3c1.4 1.1 2.8 1.1 4.2 0s2.8-1.1 4.2 0 2.8 1.1 4.2 0 2.8-1.1 4.2 0 2.8 1.1 4.2 0" stroke="#0d7d87" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M2 18.3c1.4 1.1 2.8 1.1 4.2 0s2.8-1.1 4.2 0 2.8 1.1 4.2 0 2.8-1.1 4.2 0 2.8 1.1 4.2 0" stroke="#0d7d87" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="body">
      <div class="name">Wading Pools &amp; Sprayparks</div>
      <div class="desc">What's open today</div>
    </span>
  </a>

  <a class="card" href="pools/">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 18.5 L9.5 12.5 L14 3" stroke="#0d7d87" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="15.8" cy="11.3" r="2.5" fill="#0d7d87" stroke="none"/>
        <path d="M1.5 20c1.4 1.1 2.8 1.1 4.2 0s2.8-1.1 4.2 0 2.8 1.1 4.2 0 2.8-1.1 4.2 0 2.8 1.1 4.2 0" stroke="#0d7d87" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M1.5 22.7c1.4 1.1 2.8 1.1 4.2 0s2.8-1.1 4.2 0 2.8 1.1 4.2 0 2.8-1.1 4.2 0 2.8 1.1 4.2 0" stroke="#0d7d87" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="body">
      <div class="name">Swimming Pools</div>
      <div class="desc">Kid friendly activities</div>
    </span>
  </a>

  <a class="card" href="parks/">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="7" r="4" stroke="#0d7d87" stroke-width="1.6"/>
        <path d="M12 11v9M8 20h8" stroke="#0d7d87" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="body">
      <div class="name">Parks &amp; Playgrounds</div>
      <div class="desc">Find a park by neighborhood</div>
    </span>
  </a>

  <a class="card" href="community-centers/">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 21V10.5L12 4l8 6.5V21" stroke="#0d7d87" stroke-width="1.6" stroke-linejoin="round"/>
        <rect x="9.5" y="14" width="5" height="7" stroke="#0d7d87" stroke-width="1.6"/>
      </svg>
    </span>
    <span class="body">
      <div class="name">Community Centers</div>
      <div class="desc">Hours, drop-in &amp; teen programs</div>
    </span>
  </a>

  <a class="card" href="story-time/">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5H4V5.5Z" stroke="#0d7d87" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M20 5.5C20 4.7 19.3 4 18.5 4H13a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5H20V5.5Z" stroke="#0d7d87" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="body">
      <div class="name">Story Time</div>
      <div class="desc">SPL story times by day &amp; age</div>
    </span>
  </a>
</div>
</body>
</html>
