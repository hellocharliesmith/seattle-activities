<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Pools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10222b;
    --ink-soft: #3c545c;
    --paper: #f1f6f5;
    --surface: #ffffff;
    --teal: #0d7d87;
    --teal-deep: #095a62;
    --teal-wash: #e2f1f1;
    --sun: #c97f13;
    --sun-wash: #faedd6;
    --open: #1f8a5b;
    --open-wash: #e3f3e9;
    --muted: #7c8b90;
    --line: #dbe6e4;
    --danger: #b14a34;
    --danger-wash: #f7e7e2;
    --shadow: 0 1px 2px rgba(16, 34, 43, 0.06), 0 4px 16px rgba(16, 34, 43, 0.06);
    color-scheme: light;

    /* Session/program categories - deliberately distinct from the status
       colors above (open/sun/teal/danger already mean open/holiday/
       upcoming/closed elsewhere on this page), so a calendar block's color
       never collides with a status meaning. */
    --cat-lap-swim: #2f6fb0;
    --cat-recreation-swim: #c1476b;
    --cat-family-swim: #7452c7;
    --cat-adult-senior-swim: #55707c;
    --cat-water-exercise: #a5691f;
    --cat-swim-lessons: #4a5fc1;
    --cat-multiple: #7c8b90;
    --cat-other: #7c8b90;
    --cat-pool-playland: #c97f13;
    --cat-pool-playland-wash: #faedd6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 64px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  header.top .inner { max-width: 560px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .back-home {
    display: flex; align-items: center; gap: 3px; width: fit-content; margin: 0 auto 6px;
    max-width: 560px; font-size: 12.5px; font-weight: 700; color: var(--teal); text-decoration: none;
  }
  .back-home:hover { text-decoration: underline; }
  header.top h1 {
    font-size: 20px; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
  }
  .checked-chip {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .low-confidence {
    margin: 16px 0; padding: 12px 14px; border-radius: 10px;
    background: var(--danger-wash); color: var(--danger);
    font-size: 13px; border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  }

  section { margin-top: 28px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  h2.today-date { font-size: 24px; margin: 0 0 4px; text-wrap: balance; }
  .section-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }

  /* Kid-friendly calendar card wrapper (reuses the .cal-* rules further down) */
  .search-card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; }
  .kid-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .kid-day-nav {
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .kid-day-nav button {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--teal); font-size: 18px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: inherit; box-shadow: var(--shadow);
  }
  .kid-day-nav button:hover { background: var(--teal-wash); }
  .kid-day-nav button:disabled { opacity: 0.35; cursor: default; background: var(--surface); }
  .kid-day-nav #kid-day-label { font-weight: 700; font-size: 15px; min-width: 108px; text-align: center; }
  .kid-filters { display: flex; gap: 8px; }
  .kid-filters select {
    flex: 1 1 0; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 13px; font-family: inherit;
  }
  .kid-filters select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .kid-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--cat-pool-playland-wash, var(--sun-wash)); color: var(--cat-pool-playland, var(--sun));
  }
  .outdoor-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--teal-wash); color: var(--teal-deep);
  }

  .card-list { display: flex; flex-direction: column; gap: 10px; }

  .thumb {
    width: 42px; height: 42px; border-radius: 9px; flex: 0 0 auto;
    object-fit: cover; background: var(--line); display: block;
  }
  .thumb.thumb-empty { background: var(--teal-wash); }

  details.pool-card {
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  details.pool-card.is-closed { opacity: 0.8; }
  details.pool-card > summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  details.pool-card > summary::-webkit-details-marker { display: none; }
  .summary-body { flex: 1; min-width: 0; }
  .row-name {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0;
  }
  .row-name .name {
    font-weight: 700; font-size: 14.5px; flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-text {
    font-size: 11.5px; font-weight: 700; white-space: nowrap; flex: 0 0 auto;
    color: var(--muted);
  }
  details.pool-card.is-open .status-text { color: var(--open); }
  details.pool-card.is-holiday .status-text { color: var(--sun); }
  details.pool-card.is-upcoming .status-text { color: var(--teal); }
  details.pool-card.is-closed .status-text { color: var(--danger); }
  .row-meta { margin-top: 2px; }
  .row-meta .addr-line {
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }
  details.pool-card > summary .chev { color: var(--muted); transition: transform 0.15s; flex: 0 0 auto; }
  details.pool-card > summary .chev::after { content: "\25B8"; }
  details.pool-card[open] > summary .chev { transform: rotate(90deg); }

  .pool-expand { padding: 0 14px 14px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 12px; }
  .pool-expand .blurb { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }
  .pool-expand .season-line { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }

  .holiday-note {
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
    background: var(--sun-wash); border: 1px solid color-mix(in srgb, var(--sun) 35%, transparent);
    font-size: 13px; color: var(--ink);
  }
  .holiday-note .h-label { display: block; font-weight: 700; color: var(--sun); margin-bottom: 3px; font-size: 12px; }
  .holiday-note ul { margin: 6px 0 0; padding-left: 18px; }
  .holiday-note li { margin-bottom: 2px; }

  .closure-note {
    border-radius: 10px; padding: 10px 12px; margin-bottom: 4px;
    background: var(--danger-wash); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    font-size: 13px; color: var(--ink);
  }
  .closure-note .h-label { display: block; font-weight: 700; color: var(--danger); margin-bottom: 3px; font-size: 12px; }

  .sched-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 6px; }
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
  table.sched {
    border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 420px;
  }
  table.sched th, table.sched td {
    text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top;
  }
  table.sched thead th {
    background: var(--teal-wash); color: var(--teal-deep); font-weight: 700;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
  }
  table.sched tbody tr:last-child td { border-bottom: none; }
  table.sched tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--paper) 55%, var(--surface)); }
  table.sched td:first-child, table.sched th:first-child { font-weight: 600; white-space: nowrap; }

  /* 3-day calendar view (currently only used for Ballard Pool, as a test) */
  .cal-toggle-row { display: flex; gap: 8px; margin: 12px 0 10px; }
  .cal-toggle {
    flex: 1; text-align: center; padding: 8px 10px; border-radius: 9px; cursor: pointer;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--muted); font-weight: 700; font-size: 12.5px;
  }
  .cal-toggle.active { background: var(--teal-wash); color: var(--teal-deep); border-color: transparent; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 0 0 12px; }
  .cal-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-soft); }
  .cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .cal-wrap { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .cal-time-axis { flex: 0 0 34px; position: relative; border-right: 1px solid var(--line); background: var(--paper); }
  .cal-time-label {
    position: absolute; right: 4px; transform: translateY(-50%);
    font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .cal-days { flex: 1; display: flex; }
  .cal-day-col { flex: 1; position: relative; border-right: 1px solid var(--line); }
  .cal-day-col:last-child { border-right: none; }
  .cal-day-head {
    text-align: center; font-size: 10.5px; font-weight: 700; color: var(--ink-soft);
    padding: 6px 2px; border-bottom: 1px solid var(--line); background: var(--paper);
    position: sticky; top: 0;
  }
  .cal-day-head .is-today-label { color: var(--teal); }
  .cal-grid { position: relative; }
  .cal-gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); opacity: 0.6; }
  .cal-block {
    position: absolute; border-radius: 5px; padding: 2px 4px; overflow: hidden;
    font-size: 9px; line-height: 1.25; cursor: pointer; border: 1px solid transparent;
  }
  .cal-block:focus-visible, .cal-block.selected { border-color: currentColor; }
  .cal-block .cb-time, .cal-block .cb-label {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cal-block .cb-time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .cal-empty-day { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); }
  .cal-detail {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--paper);
    font-size: 12.5px; color: var(--ink-soft); border: 1px solid var(--line);
  }
  .cal-detail .cd-title { display: block; font-weight: 700; color: var(--ink); margin-bottom: 2px; font-size: 13px; }

  .pdf-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
  .pdf-chip {
    font-size: 12.5px; font-weight: 600; color: var(--teal); text-decoration: none;
    background: var(--teal-wash); padding: 6px 11px; border-radius: 999px;
  }
  .pdf-chip:hover { text-decoration: underline; }

  .today-actions { display: flex; gap: 8px; margin-top: 12px; }
  .today-actions .action-btn {
    flex: 1; text-align: center; padding: 10px 10px; border-radius: 9px;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--teal); font-weight: 700; font-size: 13px; text-decoration: none;
  }
  .today-actions .action-btn:hover { background: var(--teal-wash); }

  footer {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px;
  }
  footer a { color: var(--teal); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .disclaimer { margin-top: 6px; }

  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    details.pool-card > summary .chev { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="back-home" href="../">&#8249; Home</a>
    <div class="inner">
      <h1 class="display"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="vertical-align:-3px;margin-right:2px;"><path d="M3 17c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="6" r="3" fill="var(--sun)"/></svg>Seattle Pools</h1>
      <span class="checked-chip" id="checked-chip"></span>
    </div>
  </header>

  <div id="low-confidence-slot"></div>

  <section id="today-header">
    <p class="eyebrow">Today</p>
    <h2 class="today-date display" id="today-date"></h2>
  </section>

  <section id="kid-section">
    <p class="eyebrow">For Toddlers &amp; Kids</p>
    <h2 class="display" style="font-size:20px;margin:0 0 12px;">Kid-friendly swim times</h2>
    <div class="kid-controls">
      <div class="kid-day-nav">
        <button type="button" id="kid-day-prev" aria-label="Previous day">&#8249;</button>
        <span id="kid-day-label"></span>
        <button type="button" id="kid-day-next" aria-label="Next day">&#8250;</button>
      </div>
      <div class="kid-filters">
        <select id="kid-filter-pool" aria-label="Filter by pool"></select>
        <select id="kid-filter-category" aria-label="Filter by activity"></select>
      </div>
    </div>
    <div class="search-card kid-cal-scope" id="kid-calendar-slot"></div>
  </section>

  <section id="pools-section">
    <p class="eyebrow">All pools</p>
    <h2 class="display" style="font-size:20px;margin:0 0 4px;">Seattle city pools</h2>
    <p class="section-sub">10 pools total; pools tagged "Outdoor" are summer-only and closed the rest of the year.</p>
    <div id="pools-list" class="card-list"></div>
  </section>

  <footer id="footer"></footer>
</div>

 pool in the Roxhill neighborhood of West Seattle. High and low diving boards, spa & sauna, and complimentary exercise machines.", "pool_kind": "indoor", "program": "Recreation Swim", "category": "Recreation Swim", "days": ["Mon", "Wed"], "start_min": 725, "end_min": 810, "time_label": "12:05-1:30pm", "details": "", "day_label": "Mon & Wed", "kid_friendly": true}, {"pool_slug": "southwest-pool", "pool_name": "Southwest Pool A 25-yard indoor pool in the Roxhill neighborhood of West Seattle. High and low diving boards, spa & sauna, and complimentary exercise machines.", "pool_kind": "indoor", "program": "Recreation Swim", "category": "Recreation Swim", "days": ["Tue", "Thu", "Fri"], "start_min": 900, "end_min": 985, "time_label": "3:00-4:25pm", "details": "", "day_label": "Tues. Thurs, Fri", "kid_friendly": true}, {"pool_slug": "southwest-pool", "pool_name": "Southwest Pool A 25-yard indoor pool in the Roxhill neighborhood of West Seattle. High and low diving boards, spa & sauna, and complimentary exercise machines.", "pool_kind": "indoor", "program": "Recreation Swim", "category": "Recreation Swim", "days": ["Sat"], "start_min": 735, "end_min": 795, "time_label": "12:15-1:15pm", "details": "", "day_label": "Sat", "kid_friendly": true}, {"pool_slug": "southwest-pool", "pool_name": "Southwest Pool A 25-yard indoor pool in the Roxhill neighborhood of West Seattle. High and low diving boards, spa & sauna, and complimentary exercise machines.", "pool_kind": "indoor", "program": "Teen Swim (free, age 13-18)", "category": "Other", "days": ["Fri"], "start_min": 990, "end_min": 1050, "time_label": "4:30-5:30pm", "details": "", "day_label": "Fri", "kid_friendly": false}, {"pool_slug": "southwest-pool", "pool_name": "Southwest Pool A 25-yard indoor pool in the Roxhill neighborhood of West Seattle. High and low diving boards, spa & sauna, and complimentary exercise machines.", "pool_kind": "indoor", "program": "Water Fitness- Shallow", "category": "Water Exercise", "days": ["Mon", "Wed"], "start_min": 840, "end_min": 885, "time_label": "2:00-2:45pm", "details": "", "day_label": "Mon & Wed", "kid_friendly": false}, {"pool_slug": "southwest-pool", "pool_name": "Southwest Pool A 25-yard indoor pool in the Roxhill neighborhood of West Seattle. High and low diving boards, spa & sauna, and complimentary exercise machines.", "pool_kind": "indoor", "program": "Water Fitness- Shallow", "category": "Water Exercise", "days": ["Tue", "Thu"], "start_min": 810, "end_min": 855, "time_label": "1:30-2:15pm", "details": "", "day_label": "Tues & Thurs", "kid_friendly": false}, {"pool_slug": "southwest-pool", "pool_name": "Southwest Pool A 25-yard indoor pool in the Roxhill neighborhood of West Seattle. High and low diving boards, spa & sauna, and complimentary exercise machines.", "pool_kind": "indoor", "program": "Water Fitness - Deep", "category": "Water Exercise", "days": ["Tue", "Thu"], "start_min": 1125, "end_min": 1170, "time_label": "6:45-7:30pm", "details": "", "day_label": "Tues & Thurs", "kid_friendly": false}], "three_day_window": [{"weekday": "Mon", "date_label": "Mon 24"}, {"weekday": "Tue", "date_label": "Tue 25"}, {"weekday": "Wed", "date_label": "Wed 26"}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('pool-data').textContent);

  document.getElementById('checked-chip').textContent = 'Checked ' + DATA.generated_at;
  document.getElementById('today-date').textContent = DATA.date_label;

  if (DATA.low_confidence) {
    const box = document.createElement('div');
    box.className = 'low-confidence';
    box.textContent = 'Heads up: the last check could not fully parse one or more pool schedules. Details below may be incomplete - verify anything important against the official page.';
    document.getElementById('low-confidence-slot').appendChild(box);
  }

  const STATUS_CLASS = {
    open: 'is-open', holiday: 'is-holiday', upcoming: 'is-upcoming',
    ended: '', unknown: '', facility_closed: 'is-closed',
  };
  // Wording differs by kind: an outdoor pool's season genuinely ends (the
  // facility shuts for winter); an indoor pool stays open year-round, so
  // "ended" just means the posted schedule table looks stale, not that the
  // building closed.
  const STATUS_LABEL = {
    outdoor: {
      open: 'In season today', holiday: 'Holiday hours', upcoming: 'Starts',
      ended: 'Season ended', unknown: 'See official page',
    },
    indoor: {
      open: 'Current schedule', holiday: 'Holiday hours', upcoming: 'New schedule',
      ended: 'Schedule may be outdated', unknown: 'See official page',
    },
  };

  function thumbHtml(pool) {
    return pool.image_url
      ? '<img class="thumb" src="' + pool.image_url + '" alt="" loading="lazy">'
      : '<span class="thumb thumb-empty"></span>';
  }

  const allPoolsSorted = [...DATA.outdoor_pools, ...DATA.indoor_pools].sort((a, b) => a.name.localeCompare(b.name));
  renderGroup(allPoolsSorted, document.getElementById('pools-list'));

  // ---- Calendar block tap-for-detail (delegated - blocks are built as HTML strings) ----
  document.addEventListener('click', (e) => {
    const block = e.target.closest('.cal-block');
    if (!block) return;
    const scope = block.closest('.pool-expand') || block.closest('.kid-cal-scope');
    const detailBox = scope && scope.querySelector('[id^="cal-detail-"]');
    if (!detailBox) return;
    detailBox.hidden = false;
    detailBox.innerHTML = '<span class="cd-title">' + escapeHtml(block.dataset.program) +
      (block.dataset.time ? ' - ' + escapeHtml(block.dataset.time) : '') + '</span>' + escapeHtml(block.dataset.details);
    scope.querySelectorAll('.cal-block.selected').forEach(b => b.classList.remove('selected'));
    block.classList.add('selected');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('cal-block')) e.target.click();
  });

  function renderGroup(pools, container) {
    pools.forEach((pool) => {
      const det = document.createElement('details');
      det.className = 'pool-card ' + (STATUS_CLASS[pool.status] || '');
      det.dataset.slug = pool.slug;

      const summary = document.createElement('summary');
      const labels = STATUS_LABEL[pool.kind];
      let statusText = pool.status === 'facility_closed' ? 'Closed' : (labels[pool.status] || '');
      if (pool.status === 'upcoming' && pool.season_start) statusText = labels.upcoming + ' ' + pool.season_start;
      if (pool.status === 'ended' && pool.season_end) statusText = labels.ended + (pool.kind === 'outdoor' ? ' ' + pool.season_end : '');
      summary.innerHTML =
        thumbHtml(pool) +
        '<span class="summary-body">' +
          '<span class="row-name">' +
            '<span class="name">' + escapeHtml(pool.name) + '</span>' +
            '<span class="status-text">' + escapeHtml(statusText) + '</span>' +
          '</span>' +
          '<span class="row-meta"><span class="addr-line">' + escapeHtml(pool.address || '') + '</span></span>' +
          '<span class="tag-row">' +
            (pool.kind === 'outdoor' ? '<span class="outdoor-badge">Outdoor</span>' : '') +
            (pool.has_kid_friendly ? '<span class="kid-badge">Kid-friendly times</span>' : '') +
          '</span>' +
        '</span>' +
        '<span class="chev"></span>';
      det.appendChild(summary);

      const expand = document.createElement('div');
      expand.className = 'pool-expand';
      let html = '';
      if (pool.blurb) html += '<p class="blurb">' + escapeHtml(pool.blurb) + '</p>';

      if (pool.status === 'facility_closed' && pool.closure) {
        html += '<div class="closure-note"><span class="h-label">' + escapeHtml(pool.closure.heading) + '</span>' +
          (pool.closure.note ? escapeHtml(pool.closure.note) : '') + '</div>';
      } else {
        if (pool.season_label) {
          html += '<p class="season-line">' + escapeHtml(pool.season_label) + (pool.season_note ? ' - ' + escapeHtml(pool.season_note) : '') + '</p>';
        }
        if (pool.status === 'holiday' && pool.todays_holiday) {
          html += '<div class="holiday-note"><span class="h-label">Today is a holiday-schedule day</span>' + escapeHtml(pool.todays_holiday) + '</div>';
        } else if (pool.holiday_note || (pool.holiday_list && pool.holiday_list.length)) {
          html += '<div class="holiday-note"><span class="h-label">Holiday exceptions</span>' +
            (pool.holiday_note ? escapeHtml(pool.holiday_note) : '') +
            (pool.holiday_list && pool.holiday_list.length ? '<ul>' + pool.holiday_list.map(h => '<li>' + escapeHtml(h) + '</li>').join('') + '</ul>' : '') +
            '</div>';
        }
        if (pool.schedule && pool.slug === 'ballard-pool') {
          // Test case: a 3-day calendar view instead of the raw table, see
          // if it reads better than scrolling a wide table sideways.
          html += '<p class="sched-label">Schedule - 3 day view (test)</p>' + renderCalendar(pool);
          html += '<details style="margin-top:10px;"><summary style="cursor:pointer;font-size:12px;font-weight:700;color:var(--teal);">View as table instead</summary>' +
            '<div style="margin-top:8px;">' + renderTable(pool.schedule) + '</div></details>';
        } else if (pool.schedule) {
          html += '<p class="sched-label">Regular drop-in schedule</p>' + renderTable(pool.schedule);
        } else if (pool.schedule_pdfs && pool.schedule_pdfs.length) {
          html += '<p class="sched-label">Schedule</p><p class="section-sub" style="margin:0 0 4px;">Posted as a PDF rather than a page table for this pool:</p>' +
            '<div class="pdf-row">' + pool.schedule_pdfs.map(pdf =>
              '<a class="pdf-chip" href="' + pdf.url + '" target="_blank" rel="noopener">' + escapeHtml(pdf.label || 'Schedule PDF') + '</a>'
            ).join('') + '</div>';
        }
        if (pool.holiday_schedule) {
          html += '<p class="sched-label">Holiday schedule</p>' + renderTable(pool.holiday_schedule);
        }
      }
      html += '<div class="today-actions">' +
        '<a class="action-btn" href="' + pool.url + '" target="_blank" rel="noopener">Seattle.gov</a>' +
        (pool.map_url ? '<a class="action-btn" href="' + pool.map_url + '" target="_blank" rel="noopener">Map</a>' : '') +
      '</div>';
      expand.innerHTML = html;
      det.appendChild(expand);

      container.appendChild(det);
    });
  }

  function renderTable(t) {
    const cols = t.columns && t.columns.length ? t.columns.length : t.rows[0].length;
    let out = '<div class="table-wrap"><table class="sched">';
    if (t.columns) {
      out += '<thead><tr>' + t.columns.map(c => '<th>' + escapeHtml(c) + '</th>').join('') + '</tr></thead>';
    }
    out += '<tbody>' + t.rows.map(r => {
      const cells = r.slice(0, cols);
      while (cells.length < cols) cells.push('');
      return '<tr>' + cells.map(c => '<td>' + escapeHtml(c) + '</td>').join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
    return out;
  }

  function catSlug(cat) {
    return (cat || 'other').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function fmtHour(min) {
    let h = Math.floor(min / 60) % 24;
    const ap = h >= 12 ? 'p' : 'a';
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ap;
  }

  // Greedy interval-graph coloring: gives each session a "lane" so same-day
  // overlapping sessions sit side by side instead of on top of each other.
  function assignLanes(sortedSessions) {
    const laneEnds = [];
    const laneOf = [];
    sortedSessions.forEach(s => {
      let placed = false;
      for (let i = 0; i < laneEnds.length; i++) {
        if (laneEnds[i] <= s.start_min) { laneEnds[i] = s.end_min; laneOf.push(i); placed = true; break; }
      }
      if (!placed) { laneEnds.push(s.end_min); laneOf.push(laneEnds.length - 1); }
    });
    return { laneOf, maxLanes: Math.max(1, laneEnds.length) };
  }

  function renderCalendar(pool) {
    const sessions = DATA.sessions.filter(s => s.pool_slug === pool.slug && s.start_min != null);
    if (!sessions.length) return '<p class="section-sub">No sessions with a parsed time for this pool.</p>';

    const days = DATA.three_day_window;
    let minStart = Math.floor(Math.min(...sessions.map(s => s.start_min)) / 60) * 60;
    let maxEnd = Math.ceil(Math.max(...sessions.map(s => s.end_min)) / 60) * 60;
    const pxPerMin = 0.52;
    const gridHeight = (maxEnd - minStart) * pxPerMin;

    let gridlines = '', timeLabels = '';
    for (let m = minStart; m <= maxEnd; m += 60) {
      const top = (m - minStart) * pxPerMin;
      gridlines += '<div class="cal-gridline" style="top:' + top.toFixed(1) + 'px;"></div>';
      timeLabels += '<span class="cal-time-label" style="top:' + top.toFixed(1) + 'px;">' + fmtHour(m) + '</span>';
    }

    const dayCols = days.map((d, i) => {
      const daySessions = sessions
        .filter(s => !s.days || s.days.indexOf(d.weekday) !== -1)
        .sort((a, b) => a.start_min - b.start_min);
      const lanes = assignLanes(daySessions);

      const blocks = daySessions.map((s, idx) => {
        const lane = lanes.laneOf[idx];
        const widthPct = 100 / lanes.maxLanes;
        const top = (s.start_min - minStart) * pxPerMin;
        const height = Math.max(15, (s.end_min - s.start_min) * pxPerMin);
        const catVar = 'var(--cat-' + catSlug(s.category) + ')';
        return '<div class="cal-block" tabindex="0" ' +
          'data-program="' + escapeHtml(s.program) + '" data-time="' + escapeHtml(s.time_label || '') + '" ' +
          'data-details="' + escapeHtml(s.details || 'No additional details posted.') + '" ' +
          'style="top:' + top.toFixed(1) + 'px;height:' + height.toFixed(1) + 'px;left:' + (lane * widthPct).toFixed(1) + '%;' +
          'width:calc(' + widthPct.toFixed(1) + '% - 2px);background:color-mix(in srgb, ' + catVar + ' 16%, var(--surface));' +
          'border-left:3px solid ' + catVar + ';color:' + catVar + ';">' +
          '<span class="cb-time">' + escapeHtml(s.time_label || '') + '</span>' +
          '<span class="cb-label">' + escapeHtml(s.program) + '</span>' +
        '</div>';
      }).join('');

      return '<div class="cal-day-col">' +
        '<div class="cal-day-head"><span class="' + (i === 0 ? 'is-today-label' : '') + '">' + escapeHtml(d.date_label) + '</span></div>' +
        '<div class="cal-grid" style="height:' + gridHeight.toFixed(1) + 'px;">' + gridlines + blocks +
        (daySessions.length ? '' : '<div class="cal-empty-day">No sessions</div>') +
        '</div>' +
      '</div>';
    }).join('');

    const usedCategories = [...new Set(sessions.map(s => s.category))];
    const legend = usedCategories.map(c =>
      '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--cat-' + catSlug(c) + ')"></span>' + escapeHtml(c) + '</span>'
    ).join('');

    return '<div class="cal-legend">' + legend + '</div>' +
      '<div class="cal-wrap">' +
        '<div class="cal-time-axis" style="height:' + (gridHeight + 22).toFixed(1) + 'px;">' +
          '<div style="height:22px;"></div>' +
          '<div style="position:relative;height:' + gridHeight.toFixed(1) + 'px;">' + timeLabels + '</div>' +
        '</div>' +
        '<div class="cal-days">' + dayCols + '</div>' +
      '</div>' +
      '<div class="cal-detail" id="cal-detail-' + pool.slug + '" hidden></div>';
  }

  // Single-day calendar of kid-friendly sessions only (Family Swim,
  // Recreation Swim, Pool Playland, plus keyword-detected toddler/parent
  // sessions), with day-arrow navigation and pool/activity dropdowns.
  // Sessions only carry weekday-of-week (not real dates), since these are
  // recurring weekly schedules, so "days" are computed client-side from
  // DATA.today_iso + an offset - any offset works, not just the 3-day
  // window the per-pool test calendar uses.
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const KID_DAY_MIN = -6, KID_DAY_MAX = 13;
  const kidState = { dayOffset: 0, pool: '', category: '' };

  function kidDayAt(offset) {
    const d = new Date(DATA.today_iso + 'T00:00:00');
    d.setDate(d.getDate() + offset);
    return {
      weekday: DOW[d.getDay()],
      label: (offset === 0 ? 'Today, ' : '') + DOW[d.getDay()] + ' ' + d.getDate(),
    };
  }

  function renderKidCalendar() {
    const slot = document.getElementById('kid-calendar-slot');
    const allKidSessions = DATA.sessions.filter(s => s.kid_friendly && s.start_min != null);
    if (!allKidSessions.length) {
      slot.innerHTML = '<p class="section-sub" style="margin:0;">No kid-friendly sessions with a parsed time were found in this refresh.</p>';
      return;
    }

    const day = kidDayAt(kidState.dayOffset);
    document.getElementById('kid-day-label').textContent = day.label;
    document.getElementById('kid-day-prev').disabled = kidState.dayOffset <= KID_DAY_MIN;
    document.getElementById('kid-day-next').disabled = kidState.dayOffset >= KID_DAY_MAX;

    const sessions = allKidSessions
      .filter(s => !s.days || s.days.indexOf(day.weekday) !== -1)
      .filter(s => !kidState.pool || s.pool_slug === kidState.pool)
      .filter(s => !kidState.category || s.category === kidState.category)
      .sort((a, b) => a.start_min - b.start_min);

    if (!sessions.length) {
      slot.innerHTML = '<p class="section-sub" style="margin:0;">No kid-friendly sessions match on this day. Try a different day or clear the filters.</p>';
      return;
    }

    const minStart = Math.floor(Math.min(...sessions.map(s => s.start_min)) / 60) * 60;
    const maxEnd = Math.ceil(Math.max(...sessions.map(s => s.end_min)) / 60) * 60;
    const pxPerMin = 0.7;
    const gridHeight = (maxEnd - minStart) * pxPerMin;

    let gridlines = '', timeLabels = '';
    for (let m = minStart; m <= maxEnd; m += 60) {
      const top = (m - minStart) * pxPerMin;
      gridlines += '<div class="cal-gridline" style="top:' + top.toFixed(1) + 'px;"></div>';
      timeLabels += '<span class="cal-time-label" style="top:' + top.toFixed(1) + 'px;">' + fmtHour(m) + '</span>';
    }

    const lanes = assignLanes(sessions);
    const blocks = sessions.map((s, idx) => {
      const lane = lanes.laneOf[idx];
      const widthPct = 100 / lanes.maxLanes;
      const top = (s.start_min - minStart) * pxPerMin;
      const height = Math.max(20, (s.end_min - s.start_min) * pxPerMin);
      const catVar = 'var(--cat-' + catSlug(s.category) + ')';
      return '<div class="cal-block" tabindex="0" ' +
        'data-program="' + escapeHtml(s.pool_name + ' - ' + s.program) + '" data-time="' + escapeHtml(s.time_label || '') + '" ' +
        'data-details="' + escapeHtml(s.details || 'No additional details posted.') + '" ' +
        'style="top:' + top.toFixed(1) + 'px;height:' + height.toFixed(1) + 'px;left:' + (lane * widthPct).toFixed(1) + '%;' +
        'width:calc(' + widthPct.toFixed(1) + '% - 2px);background:color-mix(in srgb, ' + catVar + ' 16%, var(--surface));' +
        'border-left:3px solid ' + catVar + ';color:' + catVar + ';">' +
        '<span class="cb-time">' + escapeHtml(s.time_label || '') + '</span>' +
        '<span class="cb-label">' + escapeHtml(s.pool_name) + '</span>' +
      '</div>';
    }).join('');

    const usedCategories = [...new Set(sessions.map(s => s.category))];
    const legend = usedCategories.map(c =>
      '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--cat-' + catSlug(c) + ')"></span>' + escapeHtml(c) + '</span>'
    ).join('');

    slot.innerHTML = '<div class="cal-legend">' + legend + '</div>' +
      '<div class="cal-wrap">' +
        '<div class="cal-time-axis" style="height:' + (gridHeight + 22).toFixed(1) + 'px;">' +
          '<div style="height:22px;"></div>' +
          '<div style="position:relative;height:' + gridHeight.toFixed(1) + 'px;">' + timeLabels + '</div>' +
        '</div>' +
        '<div class="cal-days"><div class="cal-day-col cal-day-col-single">' +
          '<div class="cal-grid" style="height:' + gridHeight.toFixed(1) + 'px;">' + gridlines + blocks + '</div>' +
        '</div></div>' +
      '</div>' +
      '<div class="cal-detail" id="cal-detail-kid" hidden></div>';
  }

  function setupKidControls() {
    const allKidSessions = DATA.sessions.filter(s => s.kid_friendly);

    const poolSelect = document.getElementById('kid-filter-pool');
    const pools = [...new Map(allKidSessions.map(s => [s.pool_slug, s.pool_name])).entries()]
      .sort((a, b) => a[1].localeCompare(b[1]));
    poolSelect.innerHTML = '<option value="">All pools</option>' +
      pools.map(([slug, name]) => '<option value="' + slug + '">' + escapeHtml(name) + '</option>').join('');

    const CATEGORY_ORDER = ['Family Swim', 'Recreation Swim', 'Pool Playland', 'Multiple', 'Other'];
    const catSelect = document.getElementById('kid-filter-category');
    const cats = [...new Set(allKidSessions.map(s => s.category))]
      .sort((a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b));
    catSelect.innerHTML = '<option value="">All activities</option>' +
      cats.map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>').join('');

    poolSelect.addEventListener('change', () => { kidState.pool = poolSelect.value; renderKidCalendar(); });
    catSelect.addEventListener('change', () => { kidState.category = catSelect.value; renderKidCalendar(); });

    document.getElementById('kid-day-prev').addEventListener('click', () => {
      kidState.dayOffset = Math.max(KID_DAY_MIN, kidState.dayOffset - 1);
      renderKidCalendar();
    });
    document.getElementById('kid-day-next').addEventListener('click', () => {
      kidState.dayOffset = Math.min(KID_DAY_MAX, kidState.dayOffset + 1);
      renderKidCalendar();
    });
  }
  setupKidControls();
  renderKidCalendar();

  const footer = document.getElementById('footer');
  footer.innerHTML =
    '<div><a href="' + DATA.hub_url + '" target="_blank" rel="noopener">Official seattle.gov pools page</a></div>' +
    '<div class="disclaimer">Unofficial mirror, rechecked automatically each morning (last: ' + DATA.generated_at + '). Schedules change by season and for weather/holidays - confirm anything important on the official pool page before heading out.</div>';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
})();
</script>
</body>
</html>
