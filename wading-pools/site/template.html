<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Wading Pools &amp; Sprayparks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10222b;
    --ink-soft: #3c545c;
    --paper: #f1f6f5;
    --surface: #ffffff;
    --teal: #0d7d87;
    --teal-deep: #095a62;
    --teal-wash: #e2f1f1;
    --sun: #c97f13;
    --sun-wash: #faedd6;
    --open: #1f8a5b;
    --open-wash: #e3f3e9;
    --muted: #7c8b90;
    --line: #dbe6e4;
    --danger: #b14a34;
    --danger-wash: #f7e7e2;
    --shadow: 0 1px 2px rgba(16, 34, 43, 0.06), 0 4px 16px rgba(16, 34, 43, 0.06);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 64px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  header.top .inner { max-width: 560px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .back-home {
    display: flex; align-items: center; gap: 3px; width: fit-content; margin: 0 auto 6px;
    max-width: 560px; font-size: 12.5px; font-weight: 700; color: var(--teal); text-decoration: none;
  }
  .back-home:hover { text-decoration: underline; }
  header.top h1 {
    font-size: 20px; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
  }
  .checked-chip {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .weather-card {
    margin-top: 14px; background: var(--surface); border-radius: 12px;
    box-shadow: var(--shadow); padding: 12px 14px 10px;
  }
  .weather-card .weather-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .weather-card .weather-icon { width: 32px; height: 32px; flex: 0 0 auto; }
  .weather-card .weather-condition { font-weight: 700; font-size: 14px; color: var(--ink); }
  .weather-card .weather-hl {
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px;
  }
  .weather-card .weather-chart { display: block; width: 100%; height: 140px; overflow: visible; }

  .low-confidence {
    margin: 16px 0; padding: 12px 14px; border-radius: 10px;
    background: var(--danger-wash); color: var(--danger);
    font-size: 13px; border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  }

  section { margin-top: 28px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  h2.today-date { font-size: 24px; margin: 0 0 14px; text-wrap: balance; }

  .notice {
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    background: var(--sun-wash); border: 1px solid color-mix(in srgb, var(--sun) 35%, transparent);
  }
  .notice h3 { margin: 0 0 4px; font-size: 14px; color: var(--sun); }
  .notice p { margin: 0 0 8px; font-size: 13.5px; color: var(--ink-soft); }
  .notice ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink); }
  .notice li { margin-bottom: 2px; }

  .card-list { display: flex; flex-direction: column; gap: 10px; }

  .note-badge {
    display: inline-block; margin-top: 2px; align-self: flex-start; font-size: 11px; font-weight: 700;
    padding: 1px 7px; border-radius: 999px; background: var(--sun-wash); color: var(--sun);
  }

  /* Shared card chrome: thumbnail, name+hours on one line, address+day-strip on the next */
  .thumb {
    width: 42px; height: 42px; border-radius: 9px; flex: 0 0 auto;
    object-fit: cover; background: var(--line); display: block;
  }
  .thumb.thumb-empty { background: var(--teal-wash); }
  details.pool-detail summary .row-name {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0;
  }
  details.pool-detail summary .name {
    font-weight: 700; font-size: 14.5px; flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  details.pool-detail summary .row-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px;
  }
  details.pool-detail summary .addr-line {
    font-size: 11.5px; color: var(--muted); flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  details.pool-detail summary .hours-line {
    font-variant-numeric: tabular-nums; font-size: 11.5px; font-weight: 700;
    color: var(--open); white-space: nowrap; flex: 0 0 auto;
  }
  details.pool-detail summary .status-line {
    font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; flex: 0 0 auto;
  }
  .today-actions { display: flex; gap: 8px; }
  .today-actions .action-btn {
    flex: 1; text-align: center; padding: 10px 10px; border-radius: 9px;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--teal); font-weight: 700; font-size: 13px; text-decoration: none;
  }
  .today-actions .action-btn:hover { background: var(--teal-wash); }

  .today-empty {
    background: var(--surface); border-radius: 12px; padding: 16px; box-shadow: var(--shadow);
    color: var(--ink-soft); font-size: 14px;
  }

  details.more-toggle { margin-top: 10px; }
  details.more-toggle > summary {
    list-style: none; cursor: pointer; font-size: 13px; color: var(--teal); font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 10px; border-radius: 9px;
    background: var(--paper); border: 1px solid var(--line);
  }
  details.more-toggle > summary:hover { background: var(--teal-wash); }
  details.more-toggle > summary::-webkit-details-marker { display: none; }
  details.more-toggle > summary::after { content: "\25B8"; font-size: 10px; transition: transform 0.15s; }
  details.more-toggle[open] > summary::after { transform: rotate(90deg); }
  details.more-toggle .card-list { margin-top: 8px; }

  details.pool-detail {
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  details.pool-detail > summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  details.pool-detail > summary::-webkit-details-marker { display: none; }
  details.pool-detail .summary-body { flex: 1; min-width: 0; }
  .day-strip { display: flex; gap: 4px; flex: 0 0 auto; }
  .day-dot {
    width: 9px; height: 9px; border-radius: 3px; background: var(--line);
  }
  .day-dot.on { background: var(--teal); }
  .day-dot.is-today { outline: 2px solid var(--sun); outline-offset: 1px; }
  details.pool-detail .chev { color: var(--muted); transition: transform 0.15s; flex: 0 0 auto; }
  details.pool-detail .chev::after { content: "\25B8"; }
  details.pool-detail[open] .chev { transform: rotate(90deg); }
  .pool-expand {
    padding: 0 14px 14px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 12px;
  }
  .hours-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 10px;
  }
  .hours-grid .day {
    text-align: center; font-size: 10.5px; padding: 6px 2px; border-radius: 6px;
    background: var(--paper); color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .hours-grid .day.on { background: var(--open-wash); color: var(--open); font-weight: 700; }
  .hours-grid .day .d-label { display: block; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 2px; }

  .spray-meta { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; }

  footer {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px;
  }
  footer a { color: var(--teal); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .disclaimer { margin-top: 6px; }

  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    details.pool-detail .chev, details.more-toggle > summary::before { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="back-home" href="../">&#8249; Home</a>
    <div class="inner">
      <h1 class="display"><svg class="drop" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="vertical-align:-3px;margin-right:2px;"><path d="M12 2C12 2 5 11.5 5 16a7 7 0 0 0 14 0c0-4.5-7-14-7-14z" fill="var(--teal)"/></svg>Wading Pools &amp; Sprayparks</h1>
      <span class="checked-chip" id="checked-chip"></span>
    </div>
  </header>

  <div id="weather-slot"></div>

  <div id="low-confidence-slot"></div>

  <section id="today-section">
    <p class="eyebrow">Today</p>
    <h2 class="today-date display" id="today-date"></h2>
    <div id="notice-slot"></div>
    <div id="today-open-list" class="card-list"></div>
    <div id="today-more-slot"></div>
  </section>

  <section id="sprayparks-section">
    <p class="eyebrow">Sprayparks</p>
    <h2 class="display" style="font-size:20px;margin:0 0 4px;">Self-timed spray features</h2>
    <p class="spray-meta" id="spray-meta"></p>
    <div class="card-list" id="spray-list"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script id="pool-data" type="application/json">__POOL_DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('pool-data').textContent);
  const WEEKDAY_LABEL = { Mon: 'M', Tue: 'T', Wed: 'W', Thu: 'T', Fri: 'F', Sat: 'S', Sun: 'S' };

  document.getElementById('checked-chip').textContent = 'Checked ' + DATA.generated_at;

  // ---- Weather card ----
  const WEATHER_ICONS = {
    sun:
      '<circle cx="12" cy="12" r="5" fill="var(--sun)"/>' +
      '<g stroke="var(--sun)" stroke-width="2" stroke-linecap="round">' +
      '<line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/>' +
      '<line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/>' +
      '<line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>' +
      '<line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g>',
    'partly-cloudy':
      '<circle cx="8" cy="9" r="4" fill="var(--sun)"/>' +
      '<g stroke="var(--sun)" stroke-width="1.6" stroke-linecap="round">' +
      '<line x1="8" y1="1.5" x2="8" y2="3.3"/><line x1="1.5" y1="9" x2="3.3" y2="9"/>' +
      '<line x1="3" y1="3.8" x2="4.3" y2="5.1"/></g>' +
      '<g fill="var(--muted)"><circle cx="12" cy="15" r="3.6"/><circle cx="16" cy="13.5" r="4.4"/>' +
      '<rect x="10" y="15" width="10.5" height="5.5" rx="2.75"/></g>',
    cloudy:
      '<g fill="var(--muted)"><circle cx="9" cy="13" r="4"/><circle cx="14" cy="11" r="5"/>' +
      '<circle cx="17" cy="14" r="3.5"/><rect x="7" y="13" width="12" height="6" rx="3"/></g>',
    fog:
      '<g fill="var(--muted)"><circle cx="9" cy="10" r="3.4"/><circle cx="13.5" cy="9" r="4.2"/>' +
      '<rect x="7" y="10" width="10.5" height="5" rx="2.5"/></g>' +
      '<g stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" opacity="0.8">' +
      '<line x1="3" y1="17.5" x2="21" y2="17.5"/><line x1="3" y1="20.5" x2="17" y2="20.5"/></g>',
    rain:
      '<g fill="var(--muted)"><circle cx="9" cy="10" r="3.4"/><circle cx="13.5" cy="9" r="4.2"/>' +
      '<rect x="7" y="10" width="10.5" height="5" rx="2.5"/></g>' +
      '<g stroke="var(--teal)" stroke-width="2" stroke-linecap="round">' +
      '<line x1="8" y1="18" x2="7" y2="21.5"/><line x1="12.5" y1="18" x2="11.5" y2="21.5"/>' +
      '<line x1="17" y1="18" x2="16" y2="21.5"/></g>',
    snow:
      '<g fill="var(--muted)"><circle cx="9" cy="10" r="3.4"/><circle cx="13.5" cy="9" r="4.2"/>' +
      '<rect x="7" y="10" width="10.5" height="5" rx="2.5"/></g>' +
      '<g fill="var(--teal)"><circle cx="8" cy="19.5" r="1.1"/><circle cx="12.5" cy="20.8" r="1.1"/>' +
      '<circle cx="17" cy="19.5" r="1.1"/></g>',
    storm:
      '<g fill="var(--muted)"><circle cx="9" cy="9" r="3.4"/><circle cx="13.5" cy="8" r="4.2"/>' +
      '<rect x="7" y="9" width="10.5" height="5" rx="2.5"/></g>' +
      '<path d="M13.5 14.5l-3.5 6h2.8l-1.8 4.5 4.7-6.5h-2.8l1.6-4z" fill="var(--sun)"/>',
  };

  function buildWeatherChart(w) {
    const W = 300, H = 140;
    const padTop = 20, padBottom = 40, padX = 4;
    const temps = w.hourly.map(function (p) { return p.temp_f; });
    const minT = Math.min.apply(null, temps), maxT = Math.max.apply(null, temps);
    const range = Math.max(1, maxT - minT);

    function xFor(hour) { return padX + (hour / 23) * (W - padX * 2); }
    function yFor(temp) { return padTop + (1 - (temp - minT) / range) * (H - padTop - padBottom); }

    const pts = w.hourly.map(function (p) { return { x: xFor(p.hour), y: yFor(p.temp_f) }; });

    // Catmull-Rom -> cubic Bezier, for a smooth curve through the hourly points
    let linePath = '';
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      if (i === 0) linePath += 'M' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) + ' ';
      linePath += 'C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1) + ' ';
    }
    const baseline = H - padBottom;
    const last = pts[pts.length - 1], first = pts[0];
    const areaPath = linePath + 'L' + last.x.toFixed(1) + ',' + baseline + ' L' + first.x.toFixed(1) + ',' + baseline + ' Z';

    // Everything - dots, temp labels, time labels, UV/rain - is positioned from
    // the SAME xFor(hour), so labels always land directly under their marker
    // instead of drifting against a separately-laid-out grid.
    let guides = '', markers = '';
    (w.checkpoints || []).forEach(function (cp) {
      const x = xFor(cp.hour), y = yFor(cp.temp_f);
      guides += '<line x1="' + x.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + baseline +
        '" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,2"/>';
      markers += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="var(--surface)" stroke="var(--teal)" stroke-width="2"/>' +
        '<text x="' + x.toFixed(1) + '" y="' + (y - 8).toFixed(1) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">' + cp.temp_f + '&#176;</text>' +
        '<text x="' + x.toFixed(1) + '" y="' + (baseline + 16) + '" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)">' + escapeHtml(cp.label) + '</text>' +
        '<text x="' + x.toFixed(1) + '" y="' + (baseline + 30) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">UV ' + cp.uv_index + ' &middot; ' + cp.rain_chance + '%</text>';
    });

    return '<svg class="weather-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs>' +
        '<linearGradient id="tempLine" x1="0" y1="0" x2="1" y2="0">' +
          '<stop offset="0%" stop-color="var(--teal)"/><stop offset="50%" stop-color="var(--sun)"/><stop offset="100%" stop-color="var(--teal)"/>' +
        '</linearGradient>' +
        '<linearGradient id="tempArea" x1="0" y1="0" x2="1" y2="0">' +
          '<stop offset="0%" stop-color="var(--teal)" stop-opacity="0.22"/><stop offset="50%" stop-color="var(--sun)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--teal)" stop-opacity="0.22"/>' +
        '</linearGradient>' +
      '</defs>' +
      guides +
      '<path d="' + areaPath + '" fill="url(#tempArea)"/>' +
      '<path d="' + linePath + '" fill="none" stroke="url(#tempLine)" stroke-width="2.5" stroke-linecap="round"/>' +
      markers +
    '</svg>';
  }

  if (DATA.weather) {
    const w = DATA.weather;
    const card = document.createElement('div');
    card.className = 'weather-card';
    card.innerHTML =
      '<div class="weather-head">' +
        '<svg class="weather-icon" viewBox="0 0 24 24" aria-hidden="true">' + (WEATHER_ICONS[w.icon] || WEATHER_ICONS.cloudy) + '</svg>' +
        '<div><div class="weather-condition">' + escapeHtml(w.condition) + '</div>' +
        '<div class="weather-hl">H:' + w.high_f + '&deg; L:' + w.low_f + '&deg;</div></div>' +
      '</div>' +
      buildWeatherChart(w);
    document.getElementById('weather-slot').appendChild(card);
  }

  if (DATA.low_confidence) {
    const box = document.createElement('div');
    box.className = 'low-confidence';
    box.textContent = 'Heads up: the last check parsed fewer listings than expected. Some pools or sprayparks below may be missing; verify anything important against the official page.';
    document.getElementById('low-confidence-slot').appendChild(box);
  }

  document.getElementById('today-date').textContent = DATA.today.date_label;

  // ---- Notice banner ----
  if (DATA.today.notice_active && DATA.today.notice) {
    const n = DATA.today.notice;
    const el = document.createElement('div');
    el.className = 'notice';
    el.innerHTML =
      '<h3>' + escapeHtml(n.heading || "Today's notice") + '</h3>' +
      (n.intro ? '<p>' + escapeHtml(n.intro) + '</p>' : '') +
      (n.exceptions && n.exceptions.length
        ? '<ul>' + n.exceptions.map(e => '<li>' + escapeHtml(e) + '</li>').join('') + '</ul>'
        : '');
    document.getElementById('notice-slot').appendChild(el);
  }

  // ---- Today: open pools ----
  const openToday = DATA.today.pools.filter(p => p.status === 'open');
  const notOpenToday = DATA.today.pools.filter(p => p.status !== 'open');
  const openList = document.getElementById('today-open-list');

  if (openToday.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'today-empty';
    empty.textContent = 'No neighborhood wading pools are on today\'s regular schedule. Call the hotline below to check for a weather opening, or see sprayparks below.';
    openList.appendChild(empty);
  } else {
    openToday.forEach(p => openList.appendChild(poolCard(p)));
  }

  if (notOpenToday.length) {
    const det = document.createElement('details');
    det.className = 'more-toggle';
    const sum = document.createElement('summary');
    sum.textContent = 'Show ' + notOpenToday.length + ' not open today';
    det.appendChild(sum);
    const list = document.createElement('div');
    list.className = 'card-list';
    notOpenToday.forEach(p => list.appendChild(poolCard(p)));
    det.appendChild(list);
    document.getElementById('today-more-slot').appendChild(det);
  }

  function dayStripHtml(schedule) {
    const today = DATA.today.weekday;
    return DATA.weekdays.map(d => {
      const on = !!(schedule && schedule[d]);
      return '<span class="day-dot' + (on ? ' on' : '') + (d === today ? ' is-today' : '') + '"></span>';
    }).join('');
  }

  function hoursGridHtml(schedule) {
    return DATA.weekdays.map(d => {
      const hours = schedule ? schedule[d] : null;
      return '<div class="day' + (hours ? ' on' : '') + '"><span class="d-label">' + WEEKDAY_LABEL[d] + '</span>' + (hours || '-') + '</div>';
    }).join('');
  }

  function actionButtonsHtml(p) {
    return '<div class="today-actions">' +
      (p.info_url ? '<a class="action-btn" href="' + p.info_url + '" target="_blank" rel="noopener">Seattle.gov</a>' : '') +
      (p.map_url ? '<a class="action-btn" href="' + p.map_url + '" target="_blank" rel="noopener">Map</a>' : '') +
    '</div>';
  }

  function thumbHtml(p) {
    return p.image_url
      ? '<img class="thumb" src="' + p.image_url + '" alt="" loading="lazy">'
      : '<span class="thumb thumb-empty"></span>';
  }

  // Today-section pools carry a precomputed status (accounts for season + weather
  // overrides); full-schedule pools don't, so fall back to a plain schedule lookup.
  function hoursTodayInfo(p) {
    if (p.status !== undefined) {
      if (p.status === 'open' && p.hours) return { text: p.hours, open: true };
      return { text: p.in_season ? 'Not scheduled today' : 'Not in season', open: false };
    }
    const h = p.schedule ? p.schedule[DATA.today.weekday] : null;
    return h ? { text: h, open: true } : { text: 'Closed today', open: false };
  }

  function poolCard(p) {
    const det = document.createElement('details');
    det.className = 'pool-detail';
    const info = hoursTodayInfo(p);

    const summary = document.createElement('summary');
    summary.innerHTML =
      thumbHtml(p) +
      '<span class="summary-body">' +
        '<span class="row-name">' +
          '<span class="name">' + escapeHtml(p.name) + '</span>' +
          '<span class="' + (info.open ? 'hours-line' : 'status-line') + '">' + escapeHtml(info.text) + '</span>' +
        '</span>' +
        '<span class="row-meta">' +
          '<span class="addr-line">' + escapeHtml(p.address || '') + '</span>' +
          '<span class="day-strip">' + dayStripHtml(p.schedule) + '</span>' +
        '</span>' +
        (p.note ? '<span class="note-badge">' + escapeHtml(p.note) + '</span>' : '') +
      '</span>' +
      '<span class="chev"></span>';
    det.appendChild(summary);

    const expand = document.createElement('div');
    expand.className = 'pool-expand';
    expand.innerHTML =
      '<div class="hours-grid">' + hoursGridHtml(p.schedule) + '</div>' +
      actionButtonsHtml(p);
    det.appendChild(expand);

    return det;
  }

  // ---- Sprayparks section ----
  document.getElementById('spray-meta').textContent =
    (DATA.sprayparks.season || '') + (DATA.sprayparks.hours ? ' - ' + DATA.sprayparks.hours.replace(/^These sprayparks will be open /i, '').replace(/:$/, '') : '');

  function sprayparkCard(loc) {
    const det = document.createElement('details');
    det.className = 'pool-detail';
    const isOpen = DATA.today.sprayparks_open_today;

    const summary = document.createElement('summary');
    summary.innerHTML =
      thumbHtml(loc) +
      '<span class="summary-body">' +
        '<span class="row-name">' +
          '<span class="name">' + escapeHtml(loc.name) + '</span>' +
          '<span class="' + (isOpen ? 'hours-line' : 'status-line') + '">' + (isOpen ? '11am-8pm' : 'Out of season') + '</span>' +
        '</span>' +
        '<span class="row-meta"><span class="addr-line">' + escapeHtml(loc.address || '') + '</span></span>' +
        (loc.note ? '<span class="note-badge">' + escapeHtml(loc.note) + '</span>' : '') +
      '</span>' +
      '<span class="chev"></span>';
    det.appendChild(summary);

    const expand = document.createElement('div');
    expand.className = 'pool-expand';
    expand.innerHTML = actionButtonsHtml(loc);
    det.appendChild(expand);

    return det;
  }

  const sprayList = document.getElementById('spray-list');
  DATA.sprayparks.locations.forEach(loc => sprayList.appendChild(sprayparkCard(loc)));

  // ---- Footer ----
  const footer = document.getElementById('footer');
  footer.innerHTML =
    (DATA.policy ? '<div>' + escapeHtml(DATA.policy) + '</div>' : '') +
    '<div>' + (DATA.hotline ? 'Hotline: <a href="tel:' + DATA.hotline.replace(/[^\d+]/g, '') + '">' + escapeHtml(DATA.hotline) + '</a> - ' : '') +
      (DATA.facebook_url ? '<a href="' + DATA.facebook_url + '" target="_blank" rel="noopener">Facebook updates</a> - ' : '') +
      '<a href="' + DATA.source_url + '" target="_blank" rel="noopener">Official seattle.gov page</a></div>' +
    '<div class="disclaimer">Unofficial mirror, rechecked automatically each morning (last: ' + DATA.generated_at + '). On marginal-weather days, same-day changes may not be reflected yet - call the hotline before heading out.</div>';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
})();
</script>
</body>
</html>
