<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Wading Pools &amp; Sprayparks</title>
<style>
  :root {
    --ink: #10222b;
    --ink-soft: #3c545c;
    --paper: #f1f6f5;
    --surface: #ffffff;
    --teal: #0d7d87;
    --teal-deep: #095a62;
    --teal-wash: #e2f1f1;
    --sun: #c97f13;
    --sun-wash: #faedd6;
    --open: #1f8a5b;
    --open-wash: #e3f3e9;
    --muted: #7c8b90;
    --line: #dbe6e4;
    --danger: #b14a34;
    --danger-wash: #f7e7e2;
    --shadow: 0 1px 2px rgba(16, 34, 43, 0.06), 0 4px 16px rgba(16, 34, 43, 0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e9f2f1;
      --ink-soft: #aec2c4;
      --paper: #0b171b;
      --surface: #112227;
      --teal: #4fc2ca;
      --teal-deep: #8fdde3;
      --teal-wash: rgba(79, 194, 202, 0.14);
      --sun: #e8a94d;
      --sun-wash: rgba(232, 169, 77, 0.14);
      --open: #59c98d;
      --open-wash: rgba(89, 201, 141, 0.14);
      --muted: #8ea2a6;
      --line: #203136;
      --danger: #e2836c;
      --danger-wash: rgba(226, 131, 108, 0.14);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e9f2f1; --ink-soft: #aec2c4; --paper: #0b171b; --surface: #112227;
    --teal: #4fc2ca; --teal-deep: #8fdde3; --teal-wash: rgba(79, 194, 202, 0.14);
    --sun: #e8a94d; --sun-wash: rgba(232, 169, 77, 0.14);
    --open: #59c98d; --open-wash: rgba(89, 201, 141, 0.14);
    --muted: #8ea2a6; --line: #203136; --danger: #e2836c; --danger-wash: rgba(226, 131, 108, 0.14);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ink: #10222b; --ink-soft: #3c545c; --paper: #f1f6f5; --surface: #ffffff;
    --teal: #0d7d87; --teal-deep: #095a62; --teal-wash: #e2f1f1;
    --sun: #c97f13; --sun-wash: #faedd6; --open: #1f8a5b; --open-wash: #e3f3e9;
    --muted: #7c8b90; --line: #dbe6e4; --danger: #b14a34; --danger-wash: #f7e7e2;
    --shadow: 0 1px 2px rgba(16, 34, 43, 0.06), 0 4px 16px rgba(16, 34, 43, 0.06);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    font-weight: 800;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 64px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  header.top .inner { max-width: 560px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  header.top h1 {
    font-size: 20px; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
  }
  .checked-chip {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .low-confidence {
    margin: 16px 0; padding: 12px 14px; border-radius: 10px;
    background: var(--danger-wash); color: var(--danger);
    font-size: 13px; border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  }

  section { margin-top: 28px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  h2.today-date { font-size: 24px; margin: 0 0 4px; text-wrap: balance; }
  .today-sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 14px; }

  .notice {
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    background: var(--sun-wash); border: 1px solid color-mix(in srgb, var(--sun) 35%, transparent);
  }
  .notice h3 { margin: 0 0 4px; font-size: 14px; color: var(--sun); }
  .notice p { margin: 0 0 8px; font-size: 13.5px; color: var(--ink-soft); }
  .notice ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink); }
  .notice li { margin-bottom: 2px; }

  .card-list { display: flex; flex-direction: column; gap: 10px; }

  .pool-card {
    background: var(--surface); border-radius: 12px;
    box-shadow: var(--shadow); text-decoration: none; color: inherit;
    display: block;
  }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
    background: var(--muted);
  }
  .note-badge {
    display: inline-block; margin-top: 2px; align-self: flex-start; font-size: 11px; font-weight: 700;
    padding: 1px 7px; border-radius: 999px; background: var(--sun-wash); color: var(--sun);
  }

  /* Today list: each pool is a row of two linked cards - info+hours, then address/map */
  .pool-row { display: flex; align-items: stretch; gap: 8px; }
  .pool-row .pool-card { flex: 1 1 auto; min-width: 0; }
  .info-card {
    padding: 11px 14px; display: flex; flex-direction: column; justify-content: center; gap: 3px;
  }
  .info-card .top-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .info-card .name { font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
  .info-card .hours-line {
    font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 700; color: var(--open);
  }
  .info-card .status-line { font-size: 12px; color: var(--muted); }
  .info-card.is-open .status-line { color: var(--ink-soft); }

  .map-card {
    flex: 0 0 32%; min-width: 84px; padding: 11px 12px;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  .map-card .map-eyebrow {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--teal);
  }
  .map-card .addr-text { font-size: 11.5px; line-height: 1.3; color: var(--ink-soft); overflow-wrap: anywhere; }

  /* Single-card variant, e.g. the sprayparks summary row */
  .pool-card.single { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .pool-card.single .body { flex: 1; min-width: 0; }
  .pool-card.single .name { font-weight: 700; font-size: 15px; }
  .pool-card.single .meta { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .pool-card.single.is-open .meta { color: var(--ink-soft); }
  .pool-card.single .hours {
    font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700;
    color: var(--open); white-space: nowrap; text-align: right; flex: 0 0 auto;
  }

  .today-empty {
    background: var(--surface); border-radius: 12px; padding: 16px; box-shadow: var(--shadow);
    color: var(--ink-soft); font-size: 14px;
  }

  details.more-toggle { margin-top: 10px; }
  details.more-toggle > summary {
    list-style: none; cursor: pointer; font-size: 13px; color: var(--teal); font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 0;
  }
  details.more-toggle > summary::-webkit-details-marker { display: none; }
  details.more-toggle > summary::before { content: "\25B8"; font-size: 10px; transition: transform 0.15s; }
  details.more-toggle[open] > summary::before { transform: rotate(90deg); }
  details.more-toggle .card-list { margin-top: 8px; }

  .schedule-list { display: flex; flex-direction: column; gap: 8px; }
  details.pool-detail {
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  details.pool-detail > summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  details.pool-detail > summary::-webkit-details-marker { display: none; }
  details.pool-detail .summary-body { flex: 1; min-width: 0; }
  details.pool-detail .name { font-weight: 700; font-size: 14.5px; }
  details.pool-detail .season-tag {
    font-size: 11.5px; color: var(--muted); margin-top: 1px;
  }
  details.pool-detail .season-tag.ended { text-decoration: line-through; }
  details.pool-detail .season-tag.upcoming { color: var(--teal); }
  .day-strip { display: flex; gap: 4px; flex: 0 0 auto; }
  .day-dot {
    width: 9px; height: 9px; border-radius: 3px; background: var(--line);
  }
  .day-dot.on { background: var(--teal); }
  .day-dot.is-today { outline: 2px solid var(--sun); outline-offset: 1px; }
  details.pool-detail .chev { color: var(--muted); transition: transform 0.15s; flex: 0 0 auto; }
  details.pool-detail .chev::after { content: "\25B8"; }
  details.pool-detail[open] .chev { transform: rotate(90deg); }
  .pool-expand {
    padding: 0 14px 14px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 12px;
  }
  .hours-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 10px;
  }
  .hours-grid .day {
    text-align: center; font-size: 10.5px; padding: 6px 2px; border-radius: 6px;
    background: var(--paper); color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .hours-grid .day.on { background: var(--open-wash); color: var(--open); font-weight: 700; }
  .hours-grid .day .d-label { display: block; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 2px; }
  .pool-expand .addr { font-size: 13px; color: var(--teal); text-decoration: none; }
  .pool-expand .addr:hover { text-decoration: underline; }

  .spray-meta { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; }
  .spray-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .spray-chip {
    background: var(--surface); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow);
    font-size: 13.5px; font-weight: 600;
  }
  .spray-chip .note { display: block; font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 3px; }

  footer {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px;
  }
  footer a { color: var(--teal); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .disclaimer { margin-top: 6px; }

  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    details.pool-detail .chev, details.more-toggle > summary::before { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="inner">
      <h1 class="display"><svg class="drop" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="vertical-align:-3px;margin-right:2px;"><path d="M12 2C12 2 5 11.5 5 16a7 7 0 0 0 14 0c0-4.5-7-14-7-14z" fill="var(--teal)"/></svg>Wading Pools &amp; Sprayparks</h1>
      <span class="checked-chip" id="checked-chip"></span>
    </div>
  </header>

  <div id="low-confidence-slot"></div>

  <section id="today-section">
    <p class="eyebrow">Today</p>
    <h2 class="today-date display" id="today-date"></h2>
    <p class="today-sub" id="today-sub">for kids to cool off around Seattle</p>
    <div id="notice-slot"></div>
    <div id="today-open-list" class="card-list"></div>
    <div id="today-more-slot"></div>
  </section>

  <section id="spray-today"></section>

  <section id="schedule-section">
    <p class="eyebrow">Full summer schedule</p>
    <h2 class="display" style="font-size:20px;margin:0 0 4px;">Wading pools, day by day</h2>
    <p class="today-sub" id="schedule-sub"></p>
    <div class="schedule-list" id="schedule-list"></div>
  </section>

  <section id="sprayparks-section">
    <p class="eyebrow">Sprayparks</p>
    <h2 class="display" style="font-size:20px;margin:0 0 4px;">Self-timed spray features</h2>
    <p class="spray-meta" id="spray-meta"></p>
    <div class="spray-grid" id="spray-grid"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script id="pool-data" type="application/json">__POOL_DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('pool-data').textContent);
  const WEEKDAY_LABEL = { Mon: 'M', Tue: 'T', Wed: 'W', Thu: 'T', Fri: 'F', Sat: 'S', Sun: 'S' };

  document.getElementById('checked-chip').textContent = 'Checked ' + DATA.generated_at;

  if (DATA.low_confidence) {
    const box = document.createElement('div');
    box.className = 'low-confidence';
    box.textContent = 'Heads up: the last check parsed fewer listings than expected. Some pools or sprayparks below may be missing; verify anything important against the official page.';
    document.getElementById('low-confidence-slot').appendChild(box);
  }

  document.getElementById('today-date').textContent = DATA.today.date_label;

  // ---- Notice banner ----
  if (DATA.today.notice_active && DATA.today.notice) {
    const n = DATA.today.notice;
    const el = document.createElement('div');
    el.className = 'notice';
    el.innerHTML =
      '<h3>' + escapeHtml(n.heading || "Today's notice") + '</h3>' +
      (n.intro ? '<p>' + escapeHtml(n.intro) + '</p>' : '') +
      (n.exceptions && n.exceptions.length
        ? '<ul>' + n.exceptions.map(e => '<li>' + escapeHtml(e) + '</li>').join('') + '</ul>'
        : '');
    document.getElementById('notice-slot').appendChild(el);
  }

  // ---- Today: open pools ----
  const openToday = DATA.today.pools.filter(p => p.status === 'open');
  const notOpenToday = DATA.today.pools.filter(p => p.status !== 'open');
  const openList = document.getElementById('today-open-list');

  if (openToday.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'today-empty';
    empty.textContent = 'No neighborhood wading pools are on today\'s regular schedule. Call the hotline below to check for a weather opening, or see sprayparks below.';
    openList.appendChild(empty);
  } else {
    openToday.forEach(p => openList.appendChild(poolCard(p, true)));
  }

  if (notOpenToday.length) {
    const det = document.createElement('details');
    det.className = 'more-toggle';
    const sum = document.createElement('summary');
    sum.textContent = 'Show ' + notOpenToday.length + ' not open today';
    det.appendChild(sum);
    const list = document.createElement('div');
    list.className = 'card-list';
    notOpenToday.forEach(p => list.appendChild(poolCard(p, false)));
    det.appendChild(list);
    document.getElementById('today-more-slot').appendChild(det);
  }

  function poolCard(p, isOpen) {
    const row = document.createElement('div');
    row.className = 'pool-row';

    const info = document.createElement(p.info_url ? 'a' : 'div');
    info.className = 'pool-card info-card' + (isOpen ? ' is-open' : '');
    if (p.info_url) { info.href = p.info_url; info.target = '_blank'; info.rel = 'noopener'; }
    const statusText = isOpen ? (p.hours || '') : (!p.in_season ? 'Not in season' : 'Not scheduled today');
    info.innerHTML =
      '<span class="top-row">' +
        '<span class="status-dot"></span>' +
        '<span class="name">' + escapeHtml(p.name) + '</span>' +
      '</span>' +
      (isOpen && p.hours
        ? '<span class="hours-line">' + escapeHtml(statusText) + '</span>'
        : '<span class="status-line">' + escapeHtml(statusText) + '</span>') +
      (p.note ? '<span class="note-badge">' + escapeHtml(p.note) + '</span>' : '');
    row.appendChild(info);

    const map = document.createElement(p.map_url ? 'a' : 'div');
    map.className = 'pool-card map-card';
    if (p.map_url) { map.href = p.map_url; map.target = '_blank'; map.rel = 'noopener'; }
    map.innerHTML =
      '<span class="map-eyebrow">Map</span>' +
      '<span class="addr-text">' + escapeHtml(p.address || '') + '</span>';
    row.appendChild(map);

    return row;
  }

  // ---- Sprayparks today strip ----
  const sprayToday = document.getElementById('spray-today');
  const sCard = document.createElement('div');
  sCard.className = 'pool-card single' + (DATA.today.sprayparks_open_today ? ' is-open' : '');
  sCard.innerHTML =
    '<span class="status-dot"></span>' +
    '<span class="body">' +
      '<span class="name">Sprayparks (' + DATA.sprayparks.locations.length + ' locations)</span>' +
      '<span class="meta">' + (DATA.today.sprayparks_open_today ? 'Self-timed, running today' : 'Out of season') + '</span>' +
    '</span>' +
    (DATA.today.sprayparks_open_today ? '<span class="hours">11am-8pm</span>' : '');
  sprayToday.appendChild(sCard);

  // ---- Full schedule ----
  document.getElementById('schedule-sub').textContent =
    DATA.wading_pools.length + ' pools tracked - tap one for exact days & address';
  const scheduleList = document.getElementById('schedule-list');
  const today = DATA.today.weekday;

  DATA.wading_pools.forEach(pool => {
    const det = document.createElement('details');
    det.className = 'pool-detail';

    const summary = document.createElement('summary');
    const strip = DATA.weekdays.map(d => {
      const on = !!pool.schedule[d];
      return '<span class="day-dot' + (on ? ' on' : '') + (d === today ? ' is-today' : '') + '"></span>';
    }).join('');

    let seasonLabel = pool.season || '';
    let seasonClass = '';
    if (pool.season_ended) { seasonClass = 'ended'; seasonLabel = 'Season ended - ' + seasonLabel; }
    else if (pool.season_upcoming) { seasonClass = 'upcoming'; seasonLabel = 'Starts ' + seasonLabel.split('-')[0].trim(); }

    summary.innerHTML =
      '<span class="summary-body">' +
        '<span class="name">' + escapeHtml(pool.name) + '</span>' +
        '<span class="season-tag ' + seasonClass + '">' + escapeHtml(seasonLabel) + '</span>' +
      '</span>' +
      '<span class="day-strip">' + strip + '</span>' +
      '<span class="chev"></span>';
    det.appendChild(summary);

    const expand = document.createElement('div');
    expand.className = 'pool-expand';
    const grid = DATA.weekdays.map(d => {
      const hours = pool.schedule[d];
      return '<div class="day' + (hours ? ' on' : '') + '"><span class="d-label">' + WEEKDAY_LABEL[d] + '</span>' + (hours || '-') + '</div>';
    }).join('');
    expand.innerHTML =
      '<div class="hours-grid">' + grid + '</div>' +
      (pool.map_url ? '<a class="addr" href="' + pool.map_url + '" target="_blank" rel="noopener">' + escapeHtml(pool.address || 'Map') + ' (map)</a>' : escapeHtml(pool.address || ''));
    det.appendChild(expand);

    scheduleList.appendChild(det);
  });

  // ---- Sprayparks section ----
  document.getElementById('spray-meta').textContent =
    (DATA.sprayparks.season || '') + (DATA.sprayparks.hours ? ' - ' + DATA.sprayparks.hours.replace(/^These sprayparks will be open /i, '').replace(/:$/, '') : '');
  const sprayGrid = document.getElementById('spray-grid');
  DATA.sprayparks.locations.forEach(loc => {
    const chip = document.createElement('div');
    chip.className = 'spray-chip';
    chip.innerHTML = escapeHtml(loc.name) + (loc.note ? '<span class="note">' + escapeHtml(loc.note) + '</span>' : '');
    sprayGrid.appendChild(chip);
  });

  // ---- Footer ----
  const footer = document.getElementById('footer');
  footer.innerHTML =
    (DATA.policy ? '<div>' + escapeHtml(DATA.policy) + '</div>' : '') +
    '<div>' + (DATA.hotline ? 'Hotline: <a href="tel:' + DATA.hotline.replace(/[^\d+]/g, '') + '">' + escapeHtml(DATA.hotline) + '</a> - ' : '') +
      (DATA.facebook_url ? '<a href="' + DATA.facebook_url + '" target="_blank" rel="noopener">Facebook updates</a> - ' : '') +
      '<a href="' + DATA.source_url + '" target="_blank" rel="noopener">Official seattle.gov page</a></div>' +
    '<div class="disclaimer">Unofficial mirror, rechecked automatically each morning (last: ' + DATA.generated_at + '). On marginal-weather days, same-day changes may not be reflected yet - call the hotline before heading out.</div>';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
})();
</script>
</body>
</html>
