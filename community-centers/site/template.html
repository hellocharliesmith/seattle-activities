<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Community Centers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10222b;
    --ink-soft: #3c545c;
    --paper: #f1f6f5;
    --surface: #ffffff;
    --teal: #0d7d87;
    --teal-deep: #095a62;
    --teal-wash: #e2f1f1;
    --sun: #c97f13;
    --sun-wash: #faedd6;
    --open: #1f8a5b;
    --open-wash: #e3f3e9;
    --muted: #7c8b90;
    --line: #dbe6e4;
    --danger: #b14a34;
    --danger-wash: #f7e7e2;
    --shadow: 0 1px 2px rgba(16, 34, 43, 0.06), 0 4px 16px rgba(16, 34, 43, 0.06);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 64px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  header.top .inner { max-width: 560px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .back-home {
    display: flex; align-items: center; gap: 3px; width: fit-content; margin: 0 auto 6px;
    max-width: 560px; font-size: 12.5px; font-weight: 700; color: var(--teal); text-decoration: none;
  }
  .back-home:hover { text-decoration: underline; }
  header.top h1 {
    font-size: 20px; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
  }
  .checked-chip {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .low-confidence {
    margin: 16px 0; padding: 12px 14px; border-radius: 10px;
    background: var(--danger-wash); color: var(--danger);
    font-size: 13px; border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  }

  section { margin-top: 28px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  h2.today-date { font-size: 24px; margin: 0 0 4px; text-wrap: balance; }
  .section-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }

  /* ---- Multi-select dropdown filters ---- */
  .filter-row { display: flex; gap: 8px; }
  .msel { position: relative; flex: 1 1 0; min-width: 0; }
  .msel-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .msel-btn .chev { color: var(--muted); font-size: 10px; }
  .msel-panel {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 6px; max-height: 260px; overflow-y: auto; display: none;
  }
  .msel-panel.open { display: block; }
  .msel-option { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .msel-option:hover { background: var(--teal-wash); }
  .msel-option input { accent-color: var(--teal); }
  .msel-help { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .msel-help .msel-clear { color: var(--teal); font-weight: 700; cursor: pointer; margin-left: 4px; }
  .msel-help.hidden { display: none; }

  .result-count { font-size: 12.5px; color: var(--muted); margin: 10px 0 10px; }

  .card-list { display: flex; flex-direction: column; gap: 10px; }

  details.cc-card {
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  details.cc-card > summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  details.cc-card > summary::-webkit-details-marker { display: none; }
  .summary-body { flex: 1; min-width: 0; }
  .row-name {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0;
  }
  .row-name .name {
    font-weight: 700; font-size: 14.5px; flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-text {
    font-size: 11.5px; font-weight: 700; white-space: nowrap; flex: 0 0 auto;
    color: var(--muted);
  }
  details.cc-card.is-open .status-text { color: var(--open); }
  details.cc-card.is-closed .status-text { color: var(--danger); }
  .row-meta { margin-top: 2px; }
  .row-meta .addr-line {
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }
  details.cc-card > summary .chev { color: var(--muted); transition: transform 0.15s; flex: 0 0 auto; }
  details.cc-card > summary .chev::after { content: "\25B8"; }
  details.cc-card[open] > summary .chev { transform: rotate(90deg); }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  }
  .badge-teen { background: var(--sun-wash); color: var(--sun); }
  .badge-gym { background: var(--teal-wash); color: var(--teal-deep); }

  .cc-expand { padding: 0 14px 14px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 12px; }
  .cc-expand .detail-line { font-size: 13px; color: var(--ink-soft); margin: 0 0 8px; display: flex; gap: 6px; }
  .cc-expand .detail-line .dl-label { font-weight: 700; color: var(--ink); flex: 0 0 auto; }
  .cc-expand .hours-raw { white-space: pre-line; }

  .today-actions { display: flex; gap: 8px; margin-top: 12px; }
  .today-actions .action-btn {
    flex: 1; text-align: center; padding: 10px 10px; border-radius: 9px;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--teal); font-weight: 700; font-size: 13px; text-decoration: none;
  }
  .today-actions .action-btn:hover { background: var(--teal-wash); }

  .empty-state {
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
    padding: 20px; text-align: center; color: var(--ink-soft); font-size: 13.5px;
  }

  footer {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px;
  }
  footer a { color: var(--teal); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .disclaimer { margin-top: 6px; }

  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="back-home" href="../">&#8249; Home</a>
    <div class="inner">
      <h1 class="display"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="vertical-align:-3px;margin-right:2px;"><path d="M4 21V10.5L12 4l8 6.5V21" stroke="var(--teal)" stroke-width="2" stroke-linejoin="round"/><rect x="9.5" y="14" width="5" height="7" fill="var(--sun)"/></svg>Seattle Community Centers</h1>
      <span class="checked-chip" id="checked-chip"></span>
    </div>
  </header>

  <div id="low-confidence-slot"></div>

  <section id="today-header">
    <p class="eyebrow">Today</p>
    <h2 class="today-date display" id="today-date"></h2>
  </section>

  <section id="centers-section">
    <p class="eyebrow">Find a center</p>
    <h2 class="display" style="font-size:20px;margin:0 0 4px;">All community centers</h2>
    <p class="section-sub">26 Seattle Parks community centers citywide.</p>

    <div class="filter-row">
      <div id="filter-neighborhood"></div>
      <div id="filter-features"></div>
    </div>
    <p class="msel-help hidden" id="filter-help"></p>
    <p class="result-count" id="result-count"></p>

    <div id="centers-list" class="card-list"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script id="center-data" type="application/json">__CENTER_DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('center-data').textContent);

  document.getElementById('checked-chip').textContent = 'Checked ' + DATA.generated_at;
  document.getElementById('today-date').textContent = DATA.date_label;

  if (DATA.low_confidence) {
    const box = document.createElement('div');
    box.className = 'low-confidence';
    box.textContent = 'Heads up: the last check could not fully parse hours for one or more centers. Details below may be incomplete - verify anything important against the official page.';
    document.getElementById('low-confidence-slot').appendChild(box);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function mapUrlFor(address) {
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  }

  // ---- Reusable multi-select dropdown (checkbox list in a popover) ----
  function makeMultiSelect(containerEl, {label, options, onChange}) {
    const state = new Set();
    containerEl.innerHTML =
      '<div class="msel"><button type="button" class="msel-btn"><span class="msel-label"></span><span class="chev">▾</span></button>' +
      '<div class="msel-panel"></div></div>';
    const btn = containerEl.querySelector('.msel-btn');
    const labelEl = containerEl.querySelector('.msel-label');
    const panel = containerEl.querySelector('.msel-panel');
    panel.innerHTML = options.map(o => '<label class="msel-option"><input type="checkbox" value="' + o.value + '"> ' + escapeHtml(o.label) + '</label>').join('');
    function updateLabel() { labelEl.textContent = state.size ? label + ' (' + state.size + ')' : label; }
    updateLabel();
    btn.addEventListener('click', (e) => { e.stopPropagation(); panel.classList.toggle('open'); });
    panel.addEventListener('change', (e) => {
      if (e.target.value) {
        if (e.target.checked) state.add(e.target.value); else state.delete(e.target.value);
        updateLabel(); onChange(state);
      }
    });
    document.addEventListener('click', (e) => { if (!containerEl.contains(e.target)) panel.classList.remove('open'); });
    return {
      getSelected: () => state,
      getSelectedLabels: () => options.filter(o => state.has(o.value)).map(o => o.label),
      clear: () => { state.clear(); panel.querySelectorAll('input').forEach(i => i.checked = false); updateLabel(); onChange(state); },
    };
  }

  const FEATURE_OPTIONS = [
    { value: 'teen', label: 'Teen program' },
    { value: 'gym', label: 'Drop-in gym' },
    { value: 'open', label: 'Open now' },
  ];

  let neighborhoodSel, featuresSel;
  function updateHelpAndFilter() {
    const nLabels = neighborhoodSel.getSelectedLabels();
    const fLabels = featuresSel.getSelectedLabels();
    const groups = [nLabels, fLabels].filter(g => g.length).map(g => g.join(', '));
    const help = document.getElementById('filter-help');
    if (!groups.length) {
      help.classList.add('hidden');
      help.innerHTML = '';
    } else {
      help.classList.remove('hidden');
      help.innerHTML = 'Showing: ' + escapeHtml(groups.join(' · ')) + '<span class="msel-clear" id="filter-clear">Clear</span>';
      document.getElementById('filter-clear').addEventListener('click', () => {
        neighborhoodSel.clear(); featuresSel.clear();
      });
    }
    renderList();
  }

  neighborhoodSel = makeMultiSelect(document.getElementById('filter-neighborhood'), {
    label: 'Neighborhood',
    options: DATA.neighborhood_options,
    onChange: updateHelpAndFilter,
  });
  featuresSel = makeMultiSelect(document.getElementById('filter-features'), {
    label: 'Features',
    options: FEATURE_OPTIONS,
    onChange: updateHelpAndFilter,
  });

  function matchesFilters(center) {
    const nSet = neighborhoodSel.getSelected();
    const fSet = featuresSel.getSelected();
    if (nSet.size && !nSet.has(center.neighborhood_bucket)) return false;
    if (fSet.has('teen') && !center.has_teen_program) return false;
    if (fSet.has('gym') && !center.has_drop_in_gym) return false;
    if (fSet.has('open') && center.is_open_now !== true) return false;
    return true;
  }

  function statusText(center) {
    if (center.is_open_now === true) return 'Open now';
    if (center.is_open_now === false) return 'Closed now';
    return 'See hours';
  }

  function statusClass(center) {
    if (center.is_open_now === true) return 'is-open';
    if (center.is_open_now === false) return 'is-closed';
    return '';
  }

  function renderCard(center) {
    const det = document.createElement('details');
    det.className = 'cc-card ' + statusClass(center);
    det.dataset.slug = center.slug;

    const summary = document.createElement('summary');
    summary.innerHTML =
      '<span class="summary-body">' +
        '<span class="row-name">' +
          '<span class="name">' + escapeHtml(center.name) + '</span>' +
          '<span class="status-text">' + escapeHtml(statusText(center)) + '</span>' +
        '</span>' +
        '<span class="row-meta"><span class="addr-line">' + escapeHtml(center.address || '') + '</span></span>' +
        '<span class="tag-row">' +
          (center.has_teen_program ? '<span class="badge badge-teen">Teen program</span>' : '') +
          (center.has_drop_in_gym ? '<span class="badge badge-gym">Drop-in gym</span>' : '') +
        '</span>' +
      '</span>' +
      '<span class="chev"></span>';
    det.appendChild(summary);

    const expand = document.createElement('div');
    expand.className = 'cc-expand';
    let html = '';
    if (center.today_label) {
      html += '<p class="detail-line"><span class="dl-label">Today:</span><span>' + escapeHtml(center.today_label) + '</span></p>';
    }
    if (center.hours_text) {
      html += '<p class="detail-line"><span class="dl-label">Hours:</span><span class="hours-raw">' + escapeHtml(center.hours_text) + '</span></p>';
    } else {
      html += '<p class="detail-line"><span class="dl-label">Hours:</span><span>Not posted - check the official page.</span></p>';
    }
    if (center.phone) {
      html += '<p class="detail-line"><span class="dl-label">Phone:</span><a href="tel:' + escapeHtml(center.phone.replace(/[^\d+]/g, '')) + '">' + escapeHtml(center.phone) + '</a></p>';
    }
    if (center.amenities && center.amenities.length) {
      html += '<p class="detail-line"><span class="dl-label">Amenities:</span><span>' + escapeHtml(center.amenities.join(', ')) + '</span></p>';
    }
    html += '<div class="today-actions">' +
      '<a class="action-btn" href="' + center.url + '" target="_blank" rel="noopener">Seattle.gov</a>' +
      (center.address ? '<a class="action-btn" href="' + mapUrlFor(center.address) + '" target="_blank" rel="noopener">Map</a>' : '') +
    '</div>';
    expand.innerHTML = html;
    det.appendChild(expand);
    return det;
  }

  function renderList() {
    const list = document.getElementById('centers-list');
    const matches = DATA.centers.filter(matchesFilters);
    list.innerHTML = '';
    document.getElementById('result-count').textContent =
      matches.length === DATA.centers.length
        ? DATA.centers.length + ' community centers'
        : matches.length + ' of ' + DATA.centers.length + ' community centers';

    if (!matches.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No community centers match those filters. Try clearing one.';
      list.appendChild(empty);
      return;
    }
    matches.forEach(center => list.appendChild(renderCard(center)));
  }

  renderList();

  const footer = document.getElementById('footer');
  footer.innerHTML =
    '<div><a href="' + DATA.hub_url + '" target="_blank" rel="noopener">Official seattle.gov community centers page</a></div>' +
    (DATA.teen_programs_url ? '<div><a href="' + DATA.teen_programs_url + '" target="_blank" rel="noopener">Teen programs &amp; Teen Late Night</a></div>' : '') +
    '<div class="disclaimer">Unofficial mirror, rechecked automatically (last: ' + DATA.generated_at + '). Hours change by season and for holidays - confirm anything important on the official page before heading out.</div>';
})();
</script>
</body>
</html>
